  --inf:#2a9d84; --sup:#ec8670; --rest:#a7b6b1; --ok:#2a9d84; --warn:#c98a1b;
  --acc:#2a9d84;
  --display:'Outfit', ui-rounded, system-ui, sans-serif;
  --body:'Outfit', ui-rounded, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; border-radius:10px; }

/* fundo com orbes */
.bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; transition:background .6s ease; }
.orb.a{ width:75vw; height:75vw; max-width:520px; max-height:520px; top:-18vh; right:-25vw; background:var(--acc); opacity:.38; }
.orb.b{ width:60vw; height:60vw; max-width:420px; max-height:420px; top:38vh; left:-30vw; background:#4b2bd6; opacity:.35; }
.orb.c{ width:50vw; height:50vw; max-width:360px; max-height:360px; bottom:-10vh; right:-10vw; background:#0d8f7a; opacity:.25; }
.grain{ position:absolute; inset:0; background-image:radial-gradient(rgba(29,56,51,.035) 1px, transparent 1px); background-size:3px 3px; }

main{ max-width:520px; margin:0 auto; padding:18px 16px 190px; }

.glass{ position:relative; background:linear-gradient(155deg,var(--glass-a),var(--glass-b)); border:1px solid var(--stroke); border-radius:24px; backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%); box-shadow:inset 0 1px 0 rgba(29,56,51,.08), 0 18px 50px -20px rgba(0,0,0,.6); }

/* topo */
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:6px 2px 16px; }
.top h1{ font-family:var(--display); font-weight:800; font-size:34px; line-height:1; letter-spacing:-.02em; margin:0; }
.top h1 span{ color:var(--muted); font-weight:500; }
.top .sub{ color:var(--muted); font-size:13px; margin-top:6px; display:flex; align-items:center; gap:8px; }
.sync{ width:7px; height:7px; border-radius:50%; background:var(--dim); display:inline-block; }
.sync.cloud{ background:var(--ok); box-shadow:0 0 10px var(--ok); }
.iconbtn{ width:44px; height:44px; border-radius:14px; border:1px solid var(--stroke); background:var(--glass-a); display:grid; place-items:center; flex-shrink:0; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.iconbtn svg{ width:20px; height:20px; }

/* ciclo */
.cycle{ padding:18px 18px 16px; margin-bottom:12px; }
.cycle-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
.cycle-row b{ font-family:var(--display); font-size:17px; font-weight:700; }
.cycle-row small{ color:var(--muted); font-size:12.5px; text-align:right; }
.bar{ height:10px; border-radius:99px; background:rgba(29,56,51,.07); overflow:hidden; position:relative; }
.bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 55%,#fff 0%),var(--acc)); box-shadow:0 0 18px var(--acc); transition:width .6s cubic-bezier(.2,.8,.2,1); }
.bar.time{ height:4px; margin-top:8px; }
.bar.time i{ background:rgba(255,255,255,.35); box-shadow:none; }
.legend{ display:flex; justify-content:space-between; color:var(--dim); font-size:11.5px; margin-top:6px; }
.cycle-done{ margin-top:12px; padding:12px 14px; border-radius:16px; background:rgba(255,207,92,.08); border:1px solid rgba(255,207,92,.3); color:var(--warn); font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; }

/* semana */
.week{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px; }
.wd{ border:1px solid var(--stroke); background:var(--glass-b); border-radius:16px; padding:9px 0 8px; text-align:center; position:relative; transition:border-color .2s, background .2s; }
.wd .l{ font-size:11.5px; color:var(--muted); font-weight:600; }
.wd .s{ width:22px; height:22px; margin:5px auto 0; border-radius:50%; border:1.5px solid var(--stroke2); display:grid; place-items:center; font-size:12px; }
.wd.sel{ border-color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); box-shadow:0 0 22px -6px var(--c); }
.wd.today .l{ color:var(--text); }
.wd.today::after{ content:''; position:absolute; top:5px; right:7px; width:5px; height:5px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
.wd.done .s{ background:var(--c); border-color:var(--c); color:#fff; box-shadow:0 0 12px var(--c); }
.wd.part .s{ border-color:var(--c); border-style:dashed; }
.wd.off .s{ border-style:dotted; opacity:.5; }

/* treino */
.day-head{ padding:20px 18px; margin-bottom:12px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.chip{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); border:1px solid color-mix(in srgb,var(--c) 35%,transparent); }
.day-head h2{ font-family:var(--display); font-size:26px; font-weight:800; line-height:1.1; letter-spacing:-.015em; margin:0 0 6px; }
.day-head p{ margin:0; color:var(--muted); font-size:13.5px; }

.steps{ margin-top:16px; }
.steps-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; }
.steps-top b{ font-weight:700; }
.steps-top span{ color:var(--muted); }
.segs{ display:flex; gap:4px; }
.seg{ flex:1; height:8px; border-radius:99px; background:rgba(29,56,51,.08); transition:background .3s, box-shadow .3s; }
.seg.on{ background:var(--acc); box-shadow:0 0 10px var(--acc); }
.seg.cur{ background:color-mix(in srgb,var(--acc) 35%,transparent); }

.ex{ margin-bottom:10px; overflow:hidden; border-radius:22px; }
.ex-h{ width:100%; display:flex; gap:12px; align-items:center; padding:15px 16px; border:0; background:none; text-align:left; }
.ex-st{ width:30px; height:30px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--stroke2); display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--muted); transition:all .25s; }
.ex.complete .ex-st{ background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 0 14px var(--acc); }
.ex-t{ flex:1; min-width:0; }
.ex-t .n{ font-weight:600; font-size:15px; line-height:1.3; }
.ex-t .m{ font-size:12.5px; color:var(--muted); margin-top:2px; }
.ex.complete .ex-t .n{ color:var(--muted); }
.chev{ color:var(--dim); transition:transform .25s; font-size:12px; }
.ex.open .chev{ transform:rotate(180deg); }
.ex-b{ padding:0 16px 16px; display:none; }
.ex.open .ex-b{ display:block; }
.obs{ font-size:13px; color:var(--muted); margin:0 0 10px; }
.last{ font-size:12.5px; color:var(--text); background:rgba(29,56,51,.05); border:1px solid var(--stroke); border-radius:12px; padding:8px 11px; margin-bottom:10px; }
.last em{ font-style:normal; color:var(--acc); font-weight:700; }
.wrow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--stroke); }
.wrow .lbl{ flex:1; font-size:13.5px; font-weight:600; }
.wrow .lbl small{ display:block; font-size:12px; color:var(--muted); font-weight:500; }
.wrow .fld{ width:132px; border-color:color-mix(in srgb,var(--acc) 40%,transparent); }
.hbar{ display:block; height:4px; margin-top:8px; border-radius:99px; background:rgba(29,56,51,.07); overflow:hidden; }
.hbar i{ display:block; height:100%; border-radius:99px; background:var(--acc); box-shadow:0 0 10px var(--acc); transition:width .4s cubic-bezier(.2,.8,.2,1); }
.sprog{ margin-bottom:12px; }
.sprog-top{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px; }
.sprog-top b{ color:var(--text); font-weight:700; }
.sbar{ display:flex; gap:5px; }
.sbar i{ flex:1; height:12px; border-radius:99px; background:rgba(29,56,51,.08); transition:background .3s, box-shadow .3s; }
.sbar i.on{ background:var(--acc); box-shadow:0 0 12px var(--acc); }
.srow{ display:flex; gap:8px; align-items:stretch; }
.srow .btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; }
.srow .btn svg{ width:20px; height:20px; }
.srow .undo{ height:54px; border-radius:18px; padding:0 14px; }
.btn.ok:disabled{ opacity:1; background:color-mix(in srgb,var(--acc) 16%,transparent); color:var(--acc); border-color:color-mix(in srgb,var(--acc) 40%,transparent); box-shadow:none; }
.set{ display:grid; grid-template-columns:26px 1fr 52px; gap:8px; align-items:center; padding:5px 0; }
.set.t{ grid-template-columns:26px 1fr 52px; }
.set .n{ font-size:12px; color:var(--dim); font-weight:700; text-align:center; }
.fld{ display:flex; align-items:center; height:46px; border-radius:14px; background:rgba(255,255,255,.8); border:1px solid var(--stroke); padding:0 10px; gap:6px; }
.fld:focus-within{ border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent); }
.fld input{ width:100%; min-width:0; border:0; outline:0; background:none; font-size:17px; font-weight:700; }
.fld input::placeholder{ color:var(--dim); font-weight:600; }
.fld span{ font-size:11.5px; color:var(--dim); }
.tlabel{ font-size:14px; color:var(--muted); }
.chk{ height:46px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(29,56,51,.04); display:grid; place-items:center; transition:all .2s; }
.chk svg{ width:20px; height:20px; opacity:.45; }
.set.done .chk{ background:var(--acc); border-color:var(--acc); box-shadow:0 0 16px -2px var(--acc); }
.set.done .chk svg{ opacity:1; color:#fff; }
.set.done .fld{ opacity:.7; }
.yt{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12.5px; font-weight:600; color:#d0624b; text-decoration:none; padding:7px 13px; border-radius:99px; background:rgba(236,134,112,.12); border:1px solid rgba(236,134,112,.3); }

.card{ padding:18px; margin-bottom:12px; }
.card h3{ font-family:var(--display); font-weight:700; font-size:18px; margin:0 0 4px; }
.card .hint{ color:var(--muted); font-size:13px; margin:0 0 14px; }

.pain-val{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
.pain-val b{ font-family:var(--display); font-size:40px; font-weight:800; line-height:1; color:var(--pc,var(--text)); text-shadow:0 0 20px var(--pc,transparent); }
.pain-val span{ color:var(--muted); font-size:13px; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:34px; background:none; }
input[type=range]::-webkit-slider-runnable-track{ height:8px; border-radius:99px; background:linear-gradient(90deg,#2a9d84,#f2c063 55%,#ec8670); }
input[type=range]::-moz-range-track{ height:8px; border-radius:99px; background:linear-gradient(90deg,#2a9d84,#f2c063 55%,#ec8670); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.15), 0 0 16px rgba(255,255,255,.5); }
input[type=range]::-moz-range-thumb{ width:26px; height:26px; border:0; border-radius:50%; background:#fff; box-shadow:0 0 16px rgba(255,255,255,.5); }
.scale{ display:flex; justify-content:space-between; font-size:11px; color:var(--dim); }

.btn{ width:100%; height:54px; border-radius:18px; border:1px solid color-mix(in srgb,var(--acc) 60%,transparent); background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff 15%),var(--acc)); color:#fff; font-weight:800; font-size:16px; box-shadow:0 10px 30px -8px var(--acc), inset 0 1px 0 rgba(255,255,255,.5); transition:transform .15s, opacity .2s; }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.35; box-shadow:none; }
.btn.ghost{ background:rgba(29,56,51,.05); color:var(--text); border-color:var(--stroke2); box-shadow:none; }
.btn.sm{ height:42px; width:auto; padding:0 16px; font-size:14px; border-radius:14px; }

.donecard{ text-align:center; padding:26px 18px; margin-bottom:12px; }
.donecard .big{ width:64px; height:64px; margin:0 auto 12px; border-radius:50%; background:var(--acc); color:#fff; display:grid; place-items:center; box-shadow:0 0 40px var(--acc); }
.donecard .big svg{ width:30px; height:30px; }
.donecard h2{ font-family:var(--display); font-size:24px; margin:0 0 4px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
.stat{ background:rgba(29,56,51,.04); border:1px solid var(--stroke); border-radius:16px; padding:12px 8px; text-align:center; }
.stat b{ display:block; font-family:var(--display); font-size:20px; font-weight:800; }
.stat span{ font-size:11.5px; color:var(--muted); }

/* progresso */
.sel{ width:100%; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.8); padding:0 14px; margin-bottom:12px; }
.chart{ width:100%; height:auto; display:block; }
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ display:flex; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--stroke); font-size:13.5px; }
.hist li:last-child{ border-bottom:0; }
.hist .d{ color:var(--muted); font-size:12.5px; }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--c); box-shadow:0 0 8px var(--c); }
.empty{ color:var(--muted); font-size:14px; text-align:center; padding:22px 8px; }

.ctx{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.ctx button{ height:38px; padding:0 14px; border-radius:99px; border:1px solid var(--stroke2); background:rgba(29,56,51,.04); font-size:13px; font-weight:600; }
.ctx button[aria-pressed=true]{ background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 0 14px -2px var(--acc); }
.alert{ padding:14px 16px; border-radius:18px; font-size:13.5px; margin-bottom:12px; border:1px solid; }
.alert.bad{ background:rgba(236,134,112,.12); border-color:rgba(236,134,112,.4); color:#a8472f; }
.alert.good{ background:rgba(42,157,132,.1); border-color:rgba(42,157,132,.3); color:#1d6f5c; }
.proto{ list-style:none; margin:0; padding:0; }
.proto li{ padding:10px 0; border-bottom:1px solid var(--stroke); font-size:13.5px; color:var(--muted); }
.proto li:last-child{ border-bottom:0; }
.proto b{ color:var(--text); font-weight:600; display:block; }

/* timer */
.timer{ position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); max-width:496px; margin:0 auto; padding:10px 10px 10px 14px; border-radius:22px; display:flex; align-items:center; gap:12px; z-index:20; transform:translateY(20px); opacity:0; pointer-events:none; transition:transform .3s, opacity .3s; }
.timer.on{ transform:none; opacity:1; pointer-events:auto; }
.timer.end{ border-color:var(--acc); box-shadow:0 0 36px -4px var(--acc); }
.ring{ width:44px; height:44px; flex-shrink:0; }
.timer .tt{ flex:1; }
.timer .tt b{ font-family:var(--display); font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; display:block; line-height:1.1; }
.timer .tt span{ font-size:12px; color:var(--muted); }
.tbtn{ height:40px; min-width:44px; padding:0 10px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(29,56,51,.06); font-size:13px; font-weight:700; }

/* nav */
nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:21; padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,rgba(230,243,238,0),rgba(245,232,222,.92) 45%); }
.brand{ display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.01em; color:var(--inf); margin-bottom:4px; }
.brand img{ width:34px; height:34px; border-radius:11px; box-shadow:0 2px 8px rgba(29,56,51,.12); }
.rules{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.rule{ padding:14px; border-radius:20px; }
.rule .e{ font-size:22px; line-height:1; margin-bottom:10px; }
.rule b{ display:block; font-size:14px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.rule p{ margin:0; font-size:12.5px; color:var(--muted); line-height:1.5; }
.why p{ margin:0 0 10px; color:var(--muted); font-size:14px; } .why p:last-child{ margin:0; }
.why strong{ color:var(--text); font-weight:600; }
.wk{ display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13.5px; margin-top:12px; }
.wk dt{ color:var(--dim); font-weight:700; } .wk dd{ margin:0; color:var(--muted); }
.wk dd i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--c); box-shadow:0 0 8px var(--c); }
@media (max-width:360px){ .rules{ grid-template-columns:1fr; } }
.tabs .in{ max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:6px; border-radius:24px; }
.tabs button{ height:52px; border:0; border-radius:18px; background:none; color:var(--muted); font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:background .2s,color .2s; }
.tabs button svg{ width:20px; height:20px; }
.tabs button[aria-current=page]{ color:var(--text); background:color-mix(in srgb,var(--acc) 20%,transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent), 0 0 20px -6px var(--acc); }

/* ajustes */
.sheet{ position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; justify-content:center; background:rgba(29,56,51,.22); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.sheet.on{ display:flex; }
.sheet .panel{ width:100%; max-width:520px; padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px)); border-radius:28px 28px 0 0; background:#fbfdfc; }
.sheet h3{ font-family:var(--display); font-size:22px; margin:0 0 16px; }
.field{ margin-bottom:16px; }
.sheet .panel{ max-height:88vh; overflow-y:auto; }
.sheet h4{ font-family:var(--display); font-size:17px; margin:22px 0 10px; }
.optrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--stroke); }
.optrow p{ margin:0; font-size:14px; } .optrow small{ display:block; color:var(--muted); font-size:12.5px; }
.optrow .btn{ width:auto; flex-shrink:0; }
.bk{ width:100%; min-height:96px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.8); padding:10px 12px; font-size:12px; font-family:ui-monospace,monospace; resize:vertical; margin-bottom:8px; }
.field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:8px; }
.field input[type=date]{ width:100%; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.8); padding:0 14px; }
.row{ display:flex; gap:8px; }

.toast{ position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:50%; transform:translate(-50%,-20px); opacity:0; z-index:50; padding:11px 16px; border-radius:16px; font-size:13.5px; font-weight:600; transition:all .3s; pointer-events:none; white-space:nowrap; }
.toast.on{ transform:translate(-50%,0); opacity:1; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

/* calendário estilo check-in */
.cal-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-top h3{ margin:0; text-transform:capitalize; }
.cal-nav{ display:flex; gap:6px; }
.cal-nav button{ width:36px; height:36px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(29,56,51,.05); color:var(--text); font-size:18px; line-height:1; }
.cal-nav button:disabled{ opacity:.3; }
.cal-wk{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px; }
.cal-wk span{ text-align:center; font-size:11px; color:var(--dim); text-transform:lowercase; }
.cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
.cd{ position:relative; width:100%; min-width:0; height:auto; aspect-ratio:1/1; border-radius:14px; border:1px solid transparent; background:rgba(29,56,51,.035); color:var(--muted); font-family:var(--display); font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0; }
.cd.blank{ background:none; }
.cd.fut{ color:var(--dim); background:rgba(29,56,51,.015); }
.cd.today{ border-color:var(--stroke2); color:var(--text); }
.cd.on{ color:#fff; font-weight:800; border-color:color-mix(in srgb,var(--c) 70%,#fff 30%);

@keyframes calpop{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
.cal-leg{ display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:14px; font-size:12px; color:var(--muted); }
.cal-leg i{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); margin-right:6px; vertical-align:middle; }
.cal-day{ margin-top:14px; padding:14px; border-radius:16px; background:rgba(29,56,51,.04); border:1px solid var(--stroke); }
.cal-day b{ font-family:var(--display); }
.cal-day .row{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; color:var(--muted); }
.cal-day .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.cal-day .acts .btn{ flex:1; }
.ballsvg{ display:block; filter:drop-shadow(0 0 4px #ffb86b) drop-shadow(0 0 7px #a98bff); }
.cd .ball{ position:absolute; right:2px; bottom:2px; width:auto; height:auto; background:none; border:0; box-shadow:none; }
.wd .fb{ position:absolute; top:-5px; right:-3px; }
.futcard{ display:flex; align-items:center; gap:14px; }
.futcard .ico{ flex-shrink:0; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:rgba(29,56,51,.04); border:1px solid var(--stroke); }
.futcard.on .ico{ border-color:color-mix(in srgb,#ffb86b 60%,transparent); background:radial-gradient(circle,rgba(255,184,107,.18),rgba(169,139,255,.08)); }
.futcard .tx{ flex:1; min-width:0; }
.futcard .tx b{ display:block; font-family:var(--display); font-size:16px; }
.futcard .tx span{ font-size:12.5px; color:var(--muted); }
.futcard .btn{ width:auto; flex-shrink:0; }
.leg-ball{ display:inline-flex; vertical-align:middle; margin-right:6px; }

const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtNum = n => (Math.round(n*10)/10).toLocaleString('pt-BR');

}

const S = {
  program:null, drafts:{}, sessions:[], pain:[],
  day: todayKey(), tab:'treino', open:{}, progEx:null,
  painCtx:'Joelho', painDraft:3, sync:'local'
};
const defaultProgram = () => ({ weeks:4, start: ymd(mondayOf(new Date())) });

function seed31(){}

/* ---------- armazenamento ---------- */
const LS = 'treino-erika-v1';
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({program:S.program, drafts:S.drafts, sessions:S.sessions, pain:S.pain})); }catch(e){} }
let DB = null, BASE = null, draftTimer = null;

async function initDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    BASE = 'data/users/' + id;
    const [p, d, ss, pp] = await Promise.all([
      db.doc(BASE + '/program').get(),
      db.doc(BASE + '/drafts').get(),
      db.collection(BASE + '/logs/sessions').limit(1000).get(),
      db.collection(BASE + '/logs/pain').limit(1000).get()
    ]);
    DB = db; S.sync = 'cloud';
    if(p.exists){ S.program = JSON.parse(JSON.stringify(p.data())); applyTheme(); } else await safe(() => DB.doc(BASE + '/program').set(S.program));
    seed31();
  applyTheme();
    if(d.exists && d.data().drafts) S.drafts = JSON.parse(JSON.stringify(d.data().drafts));
    const rs = new Map(ss.docs.map(x => [x.id, x.data()]));
    for(const s of S.sessions) if(!rs.has(s.id)) await safe(() => DB.doc(BASE + '/logs/sessions/' + s.id).set(s));
    S.sessions.forEach(s => rs.set(s.id, s)); S.sessions = [...rs.values()].map(x => JSON.parse(JSON.stringify(x)));
    const rp = new Map(pp.docs.map(x => [x.id, x.data()]));
    for(const s of S.pain) if(!rp.has(s.id)) await safe(() => DB.doc(BASE + '/logs/pain/' + s.id).set(s));
    S.pain.forEach(s => rp.set(s.id, s)); S.pain = [...rp.values()].map(x => JSON.parse(JSON.stringify(x)));
    lsSave(); render();
  }catch(e){ S.sync = 'local'; render(); }
}
async function safe(fn){ try{ await fn(); }catch(e){ if(e && e.code === 'quota_exceeded') toast('Armazenamento cheio. Os dados ficam só neste aparelho.'); S.sync = 'local'; } }
function saveProgram(){ lsSave(); if(DB) safe(() => DB.doc(BASE + '/program').set(S.program)); }
function saveDrafts(){ lsSave(); clearTimeout(draftTimer); draftTimer = setTimeout(() => { if(DB) safe(() => DB.doc(BASE + '/drafts').set({drafts:S.drafts})); }, 800); }
function saveSession(s){ lsSave(); if(DB) safe(() => DB.doc(BASE + '/logs/sessions/' + s.id).set(s)); }
function savePain(p){ lsSave(); if(DB) safe(() => DB.doc(BASE + '/logs/pain/' + p.id).set(p)); }

/* ---------- lógica ---------- */
const blankSets = ex => Array.from({length:ex.sets}, () => ({w:'', r:'', done:false}));
function draft(day){
  let d = S.drafts[day];
  if(!d || d.date !== ymd()){ d = S.drafts[day] = { date:ymd(), log:{}, pain:null, startedAt:null }; }
  if(!d.wt) d.wt = {};
  return d;
}
function exSets(d, ex){ if(!d.log[ex.id] || d.log[ex.id].length !== ex.sets) d.log[ex.id] = blankSets(ex); return d.log[ex.id]; }
const exDone = (d, ex) => { const s = d.log[ex.id]; return !!s && s.length === ex.sets && s.every(x => x.done); };
const sessionsDesc = () => [...S.sessions].sort((a,b) => b.finishedAt - a.finishedAt);
function lastFor(exId){ for(const s of sessionsDesc()){ const v = s.log && s.log[exId]; if(v && v.length) return v; } return null; }
const todaySession = day => sessionsDesc().find(s => s.date === ymd() && s.day === day);

function cycleInfo(){
  const P = S.program, start = parseYmd(P.start), total = P.weeks * 7;
  const elapsed = Math.max(0, Math.min(total, dayDiff(new Date(), start) + 1));
  const end = addDays(start, total);
  const inCycle = S.sessions.filter(s => { const d = parseYmd(s.date); return d >= start && d < end; });
  const planned = P.weeks * 4;
  return { week: Math.max(1, Math.min(P.weeks, Math.ceil(elapsed / 7) || 1)), weeks:P.weeks, elapsed, total, daysLeft: total - elapsed, done: inCycle.length + (P.prior || 0), planned, inCycle, ended: dayDiff(new Date(), start) >= total, notStarted: dayDiff(new Date(), start) < 0 };
}
function weekState(){
  const mon = mondayOf(new Date());
  return DAYS.map((k, i) => {
    const date = ymd(addDays(mon, i));
    const done = S.sessions.some(s => s.date === date && s.day === k);
    const dr = S.drafts[k];
    const part = !done && dr && dr.date === date && Object.values(dr.log).some(a => a.some(x => x.done));
    return { k, done, part, today: date === ymd() };
  });
}

/* ---------- gráfico ---------- */
let gid = 0;
function chart(pts, color, opt = {}){
  const W = 320, H = 160, p = {l:30, r:14, t:16, b:26};
  const ys = pts.map(q => q.y);
  let mn = opt.min ?? Math.min(...ys), mx = opt.max ?? Math.max(...ys);
  if(mn === mx){ mn -= 1; mx += 1; }
  const x = i => pts.length === 1 ? (p.l + (W-p.l-p.r)/2) : p.l + i*(W-p.l-p.r)/(pts.length-1);
  const y = v => p.t + (mx - v)*(H-p.t-p.b)/(mx - mn);
  const id = 'g' + (++gid);
  const line = pts.map((q,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(q.y).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-p.b) + ' L' + x(0).toFixed(1) + ' ' + (H-p.b) + ' Z';
  const grid = [mn, (mn+mx)/2, mx].map(v => `<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(29,56,51,.08)"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8a9c97">${fmtNum(v)}</text>`).join('');
  const dots = pts.map((q,i) => `<circle cx="${x(i)}" cy="${y(q.y)}" r="${pts.length > 20 ? 2.5 : 4}" fill="${q.c || color}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const labs = pts.length ? `<text x="${x(0)}" y="${H-6}" font-size="10" fill="#8a9c97" text-anchor="${pts.length===1?'middle':'start'}">${esc(pts[0].lab)}</text>` + (pts.length > 1 ? `<text x="${x(pts.length-1)}" y="${H-6}" font-size="10" fill="#8a9c97" text-anchor="end">${esc(pts[pts.length-1].lab)}</text>` : '') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Gráfico')}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>
    <filter id="${id}f" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${grid}${pts.length > 1 ? `<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" filter="url(#${id}f)"/>` : ''}${dots}${labs}</svg>`;
}

const dateOfDay = k => ymd(addDays(mondayOf(new Date()), DAYS.indexOf(k)));
const hasFut = date => false;
function futCard(day){
  const c = PLAN[day].care; if(!c) return '';
  return `<div class="alert care ${c.tone}"><b>${c.label}.</b> ${c.text}</div>`;
}
function viewTreino(){
  const day = S.day, plan = PLAN[day], T = TYPES[plan.type];
  const chips = `<div class="chips"><span class="chip" style="--c:${T.c}">${plan.tag || T.label}</span><span class="chip" style="--c:#62786f">${DFULL[day]}</span></div>`;
  if(!plan.ex.length){
    return `<section class="day-head glass">${chips}<h2>${plan.title}</h2><p>${plan.note}</p></section>${futCard(day)}
    <section class="card glass"><h3>Dia livre</h3><p class="hint">Se sentiu o joelho ou a lombar hoje, registre para acompanhar a evolução.</p><button class="btn ghost" data-act="tab" data-tab="joelho">Registrar dor</button></section>`;
  }
  const done = todaySession(day);
  if(done && !S.redo){
    const mins = done.startedAt ? Math.max(1, Math.round((done.finishedAt - done.startedAt)/60000)) : null;
    return `<section class="day-head glass">${chips}<h2>${plan.title}</h2></section>
    <section class="donecard glass"><div class="big">${ICON.check}</div><h2>Treino concluído</h2><p class="hint" style="color:var(--muted);margin:0">${DFULL[day]}, ${fmtDate(done.date)}</p>
      <div class="stats"><div class="stat"><b>${done.sets}</b><span>séries</span></div><div class="stat"><b>${fmtW(done.volume)}</b><span>${U()} de volume</span></div><div class="stat"><b>${mins ? mins + 'min' : '—'}</b><span>duração</span></div></div>
      
      <button class="btn ghost" data-act="redo">Registrar outro treino hoje</button></section>${futCard(day)}`;
  }
  const d = draft(day);
  const total = plan.ex.length, doneCount = plan.ex.filter(e => exDone(d, e)).length;
  const curIdx = plan.ex.findIndex(e => !exDone(d, e));
  if(S.open[day] === undefined) S.open[day] = curIdx === -1 ? null : plan.ex[curIdx].id;
  const anyDone = Object.values(d.log).some(a => a.some(x => x.done));
  let h = `<section class="day-head glass">${chips}<h2>${plan.title}</h2><p>${plan.note}</p>
    <div class="steps"><div class="steps-top"><b>${doneCount === total ? 'Tudo concluído' : `Etapa ${Math.min(doneCount+1,total)} de ${total}`}</b><span>${Math.round(doneCount/total*100)}%</span></div>
    <div class="segs">${plan.ex.map((e,i) => `<div class="seg ${exDone(d,e)?'on':''} ${i===curIdx?'cur':''}"></div>`).join('')}</div></div></section>${futCard(day)}`;
  plan.ex.forEach((ex, i) => {
    const sets = exSets(d, ex), complete = exDone(d, ex), open = S.open[day] === ex.id;
    const doneSets = sets.filter(s => s.done).length;
    const last = lastFor(ex.id);
    const best = last && ex.kind !== 'time' ? last.reduce((a,b) => (b.w > a.w || (b.w === a.w && b.r > a.r)) ? b : a) : null;
    h += `<article class="ex glass ${complete?'complete':''} ${open?'open':''}">
      <button class="ex-h" data-act="open" data-ex="${ex.id}" aria-expanded="${open}">
        <span class="ex-st">${complete ? ICON.check.replace('<svg','<svg width="15" height="15"') : i+1}</span>
        <span class="ex-t"><div class="n">${ex.star ? '★ ' : ''}${esc(ex.name)}</div><div class="m">${ex.sets} × ${ex.reps}${doneSets && !complete ? ` · ${doneSets}/${ex.sets} feitas` : ''}</div><span class="hbar" aria-hidden="true"><i style="width:${Math.round(doneSets/ex.sets*100)}%"></i></span></span>
        <span class="chev">▼</span>
      </button>
      <div class="ex-b">
        <p class="obs">${esc(ex.obs)}</p>
        ${best ? `<div class="last">Última vez: <em>${best.w ? fmtW(best.w) + ' ' + U() + ' × ' : ''}${best.r} reps</em></div>` : ''}
        ${ex.kind !== 'time' ? `<div class="wrow"><span class="lbl">Carga<small>Vale para todas as séries</small></span><label class="fld"><input inputmode="decimal" data-k="w" data-ex="${ex.id}" value="${esc(wtShow(d, ex.id))}" placeholder="${best && best.w ? fmtW(best.w) : '0'}" aria-label="Carga do exercício em ${U() === 'lb' ? 'libras' : 'quilos'}"><span>${U()}</span></label></div>` : ''}
        <div class="sprog"><div class="sprog-top"><span>${ex.sets} × ${esc(ex.reps)}</span><b>${doneSets} de ${ex.sets} séries</b></div>
          <div class="sbar" role="progressbar" aria-valuenow="${doneSets}" aria-valuemin="0" aria-valuemax="${ex.sets}" aria-label="Séries concluídas">${sets.map(s => `<i class="${s.done?'on':''}"></i>`).join('')}</div></div>
        <div class="srow">
          ${complete ? `<button class="btn ok" disabled>${ICON.check}Exercício concluído</button>` : `<button class="btn" data-act="nextset" data-ex="${ex.id}">${ICON.check}Concluir série ${doneSets+1} de ${ex.sets}</button>`}
          ${doneSets ? `<button class="tbtn undo" data-act="undoset" data-ex="${ex.id}">Desfazer</button>` : ''}
        </div>
        ${ex.yt ? `<a class="yt" href="${YT(ex.yt)}" target="_blank" rel="noopener">▶ Ver execução</a>` : ''}
      </div></article>`;
  });
  const pv = d.pain;
  h += `<section class="card glass" style="margin-top:14px"><h3>Como ficou o corpo hoje?</h3><p class="hint">Opcional. Dor no joelho ou na lombar durante o treino, de 0 a 10.</p>
    <div class="pain-val" style="--pc:${pv==null?'var(--dim)':painColor(pv)}"><b>${pv==null?'–':pv}</b><span>${pv==null?'Arraste para registrar':'de 10'}</span></div>
    <input type="range" min="0" max="10" step="1" value="${pv==null?0:pv}" data-k="pain" aria-label="Dor de 0 a 10"><div class="scale"><span>Sem dor</span><span>Dor forte</span></div></section>
    <button class="btn" data-act="finish" ${anyDone?'':'disabled'}>${doneCount === total ? 'Concluir treino' : anyDone ? `Concluir com ${doneCount} de ${total} exercícios` : 'Marque uma série para concluir'}</button>`;
  return h;
}


/* ---------- calendário de check-ins ---------- */
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DAY_BY_JS = ['dom','seg','ter','qua','qui','sex','sab'];
const futDates = () => new Set();
function checkinStats(){
  const dates = new Set(S.sessions.map(s => s.date)), fut = futDates();
  fut.forEach(d => dates.add(d));
  const mins = S.sessions.reduce((a,s) => a + (s.startedAt && s.finishedAt ? Math.min(240, (s.finishedAt - s.startedAt)/60000) : 0), 0);
  // sequência de semanas com 4+ check-ins (contando a atual se já bateu ou ainda está em andamento)
  let streak = 0, cur = 0;
  const mon = mondayOf(new Date());
  for(let w = 0; w < 104; w++){
    const m = addDays(mon, -7*w); let n = 0;
    for(let i = 0; i < 7; i++) if(dates.has(ymd(addDays(m, i)))) n++;
    if(w === 0){ cur = n; if(n >= 4) streak++; continue; }
    if(n >= 4) streak++; else break;
  }
  return { checkins: S.sessions.length + fut.size, days: dates.size, mins: Math.round(mins), streak, cur };
}
function viewCalendar(){
  const now = new Date();
  const off = S.calM || 0;
  const first = new Date(now.getFullYear(), now.getMonth() + off, 1);
  const y = first.getFullYear(), m = first.getMonth();
  const nDays = new Date(y, m + 1, 0).getDate();
  const byDate = {}; S.sessions.forEach(s => (byDate[s.date] = byDate[s.date] || []).push(s));
  const fut = futDates(), today = ymd();
  const st = checkinStats();
  const hh = Math.floor(st.mins/60), mm = st.mins % 60;
  let monthCount = 0;
  let cells = '';
  for(let i = 0; i < first.getDay(); i++) cells += '<span class="cd blank"></span>';
  for(let d = 1; d <= nDays; d++){
    const key = ymd(new Date(y, m, d)), ss = byDate[key] || [], f = fut.has(key);
    const types = [...new Set(ss.map(s => PLAN[s.day].type))];
    const on = types.length > 0;
    if(on || f) monthCount++;
    const c = on ? TYPES[types[0]].c : '', c2 = types[1] ? TYPES[types[1]].c : '';
    const cls = ['cd', on?'on':'', types.length>1?'multi':'', key===today?'today':'', key>today?'fut':'', S.calSel===key?'sel':''].join(' ');
    const lab = `${d} de ${MONTHS[m]}${on ? ', ' + types.map(t => TYPES[t].label).join(' e ') : ''}${f ? ', futevôlei' : ''}`;

function viewProgresso(ci){

  if(!S.progEx || !ids.includes(S.progEx)) S.progEx = ids[0] || null;
  const totalSets = ci.inCycle.reduce((a,s) => a + (s.sets||0), 0);

  const recent = sessionsDesc().slice(0, 12);

const TM = { end:0, total:0, int:null };

function beep(){
  try{ if(!actx) return; [0, .22, .44].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.25, actx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+t+.18); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.2); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function notifState(){

}

function b64u(str){ const p = '='.repeat((4 - str.length % 4) % 4), b = atob((str + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act === 'day'){ S.day = b.dataset.day; S.redo = false; render(); }
  else if(act === 'tab'){ S.tab = b.dataset.tab; render(); window.scrollTo({top:0}); }
  else if(act === 'open'){ S.open[S.day] = S.open[S.day] === b.dataset.ex ? null : b.dataset.ex; render(); }
  else if(act === 'nextset' || act === 'undoset'){
    unlockAudio();
    const plan = PLAN[S.day], ex = plan.ex.find(x => x.id === b.dataset.ex);
    const d = draft(S.day), sets = exSets(d, ex);
    if(act === 'undoset'){ const k = sets.map(x => x.done).lastIndexOf(true); if(k >= 0) sets[k].done = false; stopTimer(); saveDrafts(); render(); return; }
    wakeOn();
    const i = sets.findIndex(x => !x.done); if(i < 0) return;
    const s = sets[i];
    s.done = true;
    if(s.done){
      if(!d.startedAt) d.startedAt = Date.now();
      if(ex.kind !== 'time'){
        const last = lastFor(ex.id), ph = last ? (last[i] || last[last.length-1]) : null;
        if((d.wt[ex.id] ?? '') === '' && ph && ph.w){ d.wt[ex.id] = String(r1(toU(ph.w))).replace('.', ','); (d.wtu = d.wtu || {})[ex.id] = U(); }
        if(s.r === '') s.r = String(ph && ph.r ? ph.r : firstNum(ex.reps));
      }
      if(exDone(d, ex)){
        const next = plan.ex.find(x => !exDone(d, x));
        S.open[S.day] = next ? next.id : null;
        if(ex.rest && next) startTimer(ex.rest);
      } else startTimer(ex.rest);
    }
    saveDrafts(); render();
  }
  else if(act === 'finish'){
    const plan = PLAN[S.day], d = draft(S.day), log = {};
    let sets = 0, volume = 0;
    plan.ex.forEach(ex => {
      const done = (d.log[ex.id] || []).filter(s => s.done);
      if(!done.length) return;
      log[ex.id] = done.map(s => ex.kind === 'time' ? {w:0, r:0} : {w:r1(wtKg(d, ex.id)*100)/100, r:num(s.r)});
      sets += done.length; volume += log[ex.id].reduce((a,s) => a + s.w*s.r, 0);
    });
    const sess = { id:uid('s'), day:S.day, date:d.date, startedAt:d.startedAt, finishedAt:Date.now(), log, sets, volume:Math.round(volume), pain:d.pain };
    S.sessions.push(sess); saveSession(sess); markTrained();
    if(d.pain != null){ const p = { id:uid('p'), date:d.date, ts:Date.now(), value:d.pain, ctx:'Pós-treino' }; S.pain.push(p); savePain(p); }
    delete S.drafts[S.day]; S.open[S.day] = undefined; S.redo = false;
    saveDrafts(); stopTimer(); render(); window.scrollTo({top:0, behavior:'smooth'}); toast('Treino concluído');
  }
  else if(act === 'redo'){ S.redo = true; S.drafts[S.day] = null; S.open[S.day] = undefined; render(); }
  else if(act === 'calm'){ S.calM = Math.min(0, (S.calM||0) + +b.dataset.d); S.calSel = null; render(); }
  else if(act === 'calday'){ S.calSel = S.calSel === b.dataset.date ? null : b.dataset.date; render(); }
  else if(act === 'futtoggle'){ const f = S.program.fut = S.program.fut || [], k = b.dataset.date, i = f.indexOf(k); if(i >= 0) f.splice(i, 1); else f.push(k); saveProgram(); render(); toast(i >= 0 ? 'Futevôlei removido' : 'Futevôlei registrado 🏐'); }
  else if(act === 'calfut'){ const f = S.program.fut = S.program.fut || [], k = b.dataset.date, i = f.indexOf(k); if(i >= 0) f.splice(i, 1); else f.push(k); saveProgram(); render(); toast(i >= 0 ? 'Futevôlei removido' : 'Futevôlei registrado'); }
  else if(act === 'calmark'){ const k = b.dataset.date, t = parseYmd(k).setHours(19,0,0,0); const sess = { id:uid('s'), day:b.dataset.day, date:k, startedAt:null, finishedAt:t, log:{}, sets:0, volume:0, pain:null, manual:true }; S.sessions.push(sess); saveSession(sess); render(); toast('Check-in registrado'); }
  else if(act === 'calunmark'){ const k = b.dataset.date; S.sessions.filter(s => s.manual && s.date === k).forEach(s => { if(DB) safe(() => DB.doc(BASE + '/logs/sessions/' + s.id).delete()); }); S.sessions = S.sessions.filter(s => !(s.manual && s.date === k)); lsSave(); render(); toast('Registro removido'); }
  else if(act === 'ctx'){ S.painCtx = b.dataset.ctx; render(); }
  else if(act === 'savepain'){ const p = { id:uid('p'), date:ymd(), ts:Date.now(), value:S.painDraft, ctx:S.painCtx }; S.pain.push(p); savePain(p); render(); toast('Registro salvo'); }
  else if(act === 'settings'){ renderSheet(); document.getElementById('sheet').classList.add('on'); }
  else if(act === 'push'){ subscribePush(); }
  else if(act === 'copypush'){ copyText(S.pushCode, 'Código copiado. Cole no secret PUSH_SUB do GitHub.'); }
  else if(act === 'notif'){ if('Notification' in window) Notification.requestPermission().then(() => { renderSheet(); if(Notification.permission === 'granted') toast('Avisos ativados'); }); }
  else if(act === 'wake'){ S.program.wake = S.program.wake === false; saveProgram(); if(S.program.wake === false) wakeOff(); renderSheet(); }
  else if(act === 'export'){
    const txt = JSON.stringify({app:'treino-erika', v:1, program:S.program, sessions:S.sessions, pain:S.pain});
    const ta = document.getElementById('bk'); ta.value = txt; ta.select();
    const ok = () => toast('Backup copiado. Cole na outra versão do app.');
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, () => toast('Selecionado. Copie o texto da caixa.')); else { try{ document.execCommand('copy'); ok(); }catch(e){ toast('Selecionado. Copie o texto da caixa.'); } }
  }
  else if(act === 'import'){
    let B; try{ B = JSON.parse(document.getElementById('bk').value.trim()); }catch(e){ toast('Backup inválido. Cole o texto completo.'); return; }
    if(!B || B.app !== 'treino-erika'){ toast('Esse texto não é um backup do app.'); return; }
    const ms = new Map(S.sessions.map(x => [x.id, x])); (B.sessions || []).forEach(x => ms.set(x.id, x)); S.sessions = [...ms.values()];
    const mp = new Map(S.pain.map(x => [x.id, x])); (B.pain || []).forEach(x => mp.set(x.id, x)); S.pain = [...mp.values()];
    if(B.program) S.program = Object.assign({}, B.program, {seed31:true});
    saveProgram();
    if(DB){ (B.sessions || []).forEach(x => safe(() => DB.doc(BASE + '/logs/sessions/' + x.id).set(x))); (B.pain || []).forEach(x => safe(() => DB.doc(BASE + '/logs/pain/' + x.id).set(x))); }
    lsSave(); renderSheet(); render(); toast((B.sessions || []).length + ' treinos importados');
  }
  else if(act === 'closesheet'){ document.getElementById('sheet').classList.remove('on'); render(); }
  else if(act === 'theme'){ S.program.theme = b.dataset.v; saveProgram(); applyTheme(); renderSheet(); }
  else if(act === 'unit'){ S.program.unit = b.dataset.v; saveProgram(); renderSheet(); render(); }
  else if(act === 'weeks'){ S.program.weeks = +b.dataset.w; saveProgram(); renderSheet(); render(); }
  else if(act === 'newcycle'){ S.program.start = ymd(); S.program.prior = 0; saveProgram(); renderSheet(); render(); toast('Novo ciclo iniciado'); }
  else if(act === 't-15'){ TM.end -= 15000; if(TM.end < Date.now()) TM.end = Date.now(); tick(); }
  else if(act === 't+15'){ if(!TM.int){ TM.end = Date.now(); TM.int = setInterval(tick, 250); } TM.end += 15000; TM.total = Math.max(TM.total, Math.ceil((TM.end-Date.now())/1000)); tick(); }
  else if(act === 'tskip'){ stopTimer(); }
});
document.getElementById('sheet').addEventListener('click', e => { if(e.target.id === 'sheet'){ e.currentTarget.classList.remove('on'); render(); } });
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.k; if(!k) return;
  if(k === 'w'){ const d = draft(S.day); d.wt[t.dataset.ex] = t.value.replace(/[^\d.,]/g, ''); (d.wtu = d.wtu || {})[t.dataset.ex] = U(); saveDrafts(); }
  else if(k === 'r'){ const ex = PLAN[S.day].ex.find(x => x.id === t.dataset.ex), d = draft(S.day); exSets(d, ex)[+t.dataset.i][k] = t.value.replace(/[^\d.,]/g, ''); saveDrafts(); }
  else if(k === 'pain'){ const d = draft(S.day); d.pain = +t.value; saveDrafts(); const pv = t.closest('.card').querySelector('.pain-val'); pv.style.setProperty('--pc', painColor(d.pain)); pv.innerHTML = `<b>${d.pain}</b><span>de 10</span>`; }
  else if(k === 'painDraft'){ S.painDraft = +t.value; const pv = t.closest('.card').querySelector('.pain-val'); pv.style.setProperty('--pc', painColor(S.painDraft)); pv.querySelector('b').textContent = S.painDraft; }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.k;
  if(k === 'progEx'){ S.progEx = t.value; render(); }
  if(k === 'start' && t.value){ S.program.start = t.value; saveProgram(); render(); }
  if(k === 'prior'){ S.program.prior = Math.max(0, parseInt(t.value, 10) || 0); saveProgram(); render(); }
  if(k === 'pain') render();
});

/* ---------- início ---------- */
(function boot(){
  const L = lsLoad();
  S.program = L.program || defaultProgram();
  seed31();
  S.pushCode = localStorage.getItem('treino-push') || '';
  S.drafts = L.drafts || {}; S.sessions = L.sessions || []; S.pain = L.pain || [];
  Object.keys(S.drafts).forEach(k => { if(!S.drafts[k] || S.drafts[k].date !== ymd()) delete S.drafts[k]; });
  const h = location.hash.slice(1); if(['treino','progresso','joelho','guia'].includes(h)) S.tab = h;
  render();
  initDb();
  
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
