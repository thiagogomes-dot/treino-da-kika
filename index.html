  --inf:#2a9d84; --sup:#ec8670; --rest:#a7b6b1; --ok:#2a9d84; --warn:#c98a1b;
  --acc:#2a9d84;
  --display:'Outfit', ui-rounded, system-ui, sans-serif;
  --body:'Outfit', ui-rounded, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; border-radius:10px; }

/* fundo com orbes */
.bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; transition:background .6s ease; }
.orb.a{ width:75vw; height:75vw; max-width:520px; max-height:520px; top:-18vh; right:-25vw; background:var(--acc); opacity:.38; }
.orb.b{ width:60vw; height:60vw; max-width:420px; max-height:420px; top:38vh; left:-30vw; background:#4b2bd6; opacity:.35; }
.orb.c{ width:50vw; height:50vw; max-width:360px; max-height:360px; bottom:-10vh; right:-10vw; background:#0d8f7a; opacity:.25; }
.grain{ position:absolute; inset:0; background-image:radial-gradient(rgba(29,56,51,.035) 1px, transparent 1px); background-size:3px 3px; }

main{ max-width:520px; margin:0 auto; padding:18px 16px 190px; }

.glass{ position:relative; background:linear-gradient(155deg,var(--glass-a),var(--glass-b)); border:1px solid var(--stroke); border-radius:24px; backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%); box-shadow:inset 0 1px 0 rgba(29,56,51,.08), 0 18px 50px -20px rgba(0,0,0,.6); }

/* topo */
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:6px 2px 16px; }
.top h1{ font-family:var(--display); font-weight:800; font-size:34px; line-height:1; letter-spacing:-.02em; margin:0; }
.top h1 span{ color:var(--muted); font-weight:500; }
.top .sub{ color:var(--muted); font-size:13px; margin-top:6px; display:flex; align-items:center; gap:8px; }
.sync{ width:7px; height:7px; border-radius:50%; background:var(--dim); display:inline-block; }
.sync.cloud{ background:var(--ok); box-shadow:0 0 10px var(--ok); }
.iconbtn{ width:44px; height:44px; border-radius:14px; border:1px solid var(--stroke); background:var(--glass-a); display:grid; place-items:center; flex-shrink:0; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.iconbtn svg{ width:20px; height:20px; }

/* ciclo */
.cycle{ padding:18px 18px 16px; margin-bottom:12px; }
.cycle-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
.cycle-row b{ font-family:var(--display); font-size:17px; font-weight:700; }
.cycle-row small{ color:var(--muted); font-size:12.5px; text-align:right; }
.bar{ height:10px; border-radius:99px; background:rgba(29,56,51,.07); overflow:hidden; position:relative; }
.bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 55%,#fff 0%),var(--acc)); box-shadow:0 0 18px var(--acc); transition:width .6s cubic-bezier(.2,.8,.2,1); }
.bar.time{ height:4px; margin-top:8px; }
.bar.time i{ background:rgba(255,255,255,.35); box-shadow:none; }
.legend{ display:flex; justify-content:space-between; color:var(--dim); font-size:11.5px; margin-top:6px; }
.cycle-done{ margin-top:12px; padding:12px 14px; border-radius:16px; background:rgba(255,207,92,.08); border:1px solid rgba(255,207,92,.3); color:var(--warn); font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; }

/* semana */
.week{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px; }
.wd{ border:1px solid var(--stroke); background:var(--glass-b); border-radius:16px; padding:9px 0 8px; text-align:center; position:relative; transition:border-color .2s, background .2s; }
.wd .l{ font-size:11.5px; color:var(--muted); font-weight:600; }
.wd .s{ width:22px; height:22px; margin:5px auto 0; border-radius:50%; border:1.5px solid var(--stroke2); display:grid; place-items:center; font-size:12px; }
.wd.sel{ border-color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); box-shadow:0 0 22px -6px var(--c); }
.wd.today .l{ color:var(--text); }
.wd.today::after{ content:''; position:absolute; top:5px; right:7px; width:5px; height:5px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
.wd.done .s{ background:var(--c); border-color:var(--c); color:#fff; box-shadow:0 0 12px var(--c); }
.wd.part .s{ border-color:var(--c); border-style:dashed; }
.wd.off .s{ border-style:dotted; opacity:.5; }

/* treino */
.day-head{ padding:20px 18px; margin-bottom:12px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.chip{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); border:1px solid color-mix(in srgb,var(--c) 35%,transparent); }
.day-head h2{ font-family:var(--display); font-size:26px; font-weight:800; line-height:1.1; letter-spacing:-.015em; margin:0 0 6px; }
.day-head p{ margin:0; color:var(--muted); font-size:13.5px; }

.steps{ margin-top:16px; }
.steps-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; }
.steps-top b{ font-weight:700; }
.steps-top span{ color:var(--muted); }
.segs{ display:flex; gap:4px; }
.seg{ flex:1; height:8px; border-radius:99px; background:rgba(29,56,51,.08); transition:background .3s, box-shadow .3s; }
.seg.on{ background:var(--acc); box-shadow:0 0 10px var(--acc); }
.seg.cur{ background:color-mix(in srgb,var(--acc) 35%,transparent); }

.ex{ margin-bottom:10px; overflow:hidden; border-radius:22px; }
.ex-h{ width:100%; display:flex; gap:12px; align-items:center; padding:15px 16px; border:0; background:none; text-align:left; }
.ex-st{ width:30px; height:30px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--stroke2); display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--muted); transition:all .25s; }
.ex.complete .ex-st{ background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 0 14px var(--acc); }
.ex-t{ flex:1; min-width:0; }
.ex-t .n{ font-weight:600; font-size:15px; line-height:1.3; }
.ex-t .m{ font-size:12.5px; color:var(--muted); margin-top:2px; }
.ex.complete .ex-t .n{ color:var(--muted); }
.chev{ color:var(--dim); transition:transform .25s; font-size:12px; }
.ex.open .chev{ transform:rotate(180deg); }
.ex-b{ padding:0 16px 16px; display:none; }
.ex.open .ex-b{ display:block; }
.obs{ font-size:13px; color:var(--muted); margin:0 0 10px; }
.last{ font-size:12.5px; color:var(--text); background:rgba(29,56,51,.05); border:1px solid var(--stroke); border-radius:12px; padding:8px 11px; margin-bottom:10px; }
.last em{ font-style:normal; color:var(--acc); font-weight:700; }
.wrow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--stroke); }
.wrow .lbl{ flex:1; font-size:13.5px; font-weight:600; }
.wrow .lbl small{ display:block; font-size:12px; color:var(--muted); font-weight:500; }
.wrow .fld{ width:96px; border-color:color-mix(in srgb,var(--acc) 40%,transparent); }
.hbar{ display:block; height:4px; margin-top:8px; border-radius:99px; background:rgba(29,56,51,.07); overflow:hidden; }
.hbar i{ display:block; height:100%; border-radius:99px; background:var(--acc); box-shadow:0 0 10px var(--acc); transition:width .4s cubic-bezier(.2,.8,.2,1); }
.sprog{ margin-bottom:12px; }
.sprog-top{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px; }
.sprog-top b{ color:var(--text); font-weight:700; }
.sbar{ display:flex; gap:5px; }
.sbar i{ flex:1; height:12px; border-radius:99px; background:rgba(29,56,51,.08); transition:background .3s, box-shadow .3s; }
.sbar i.on{ background:var(--acc); box-shadow:0 0 12px var(--acc); }
.srow{ display:flex; gap:8px; align-items:stretch; }
.srow .btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; }
.srow .btn svg{ width:20px; height:20px; }
.srow .undo{ height:54px; border-radius:18px; padding:0 14px; }
.btn.ok:disabled{ opacity:1; background:color-mix(in srgb,var(--acc) 16%,transparent); color:var(--acc); border-color:color-mix(in srgb,var(--acc) 40%,transparent); box-shadow:none; }
.set{ display:grid; grid-template-columns:26px 1fr 52px; gap:8px; align-items:center; padding:5px 0; }
.set.t{ grid-template-columns:26px 1fr 52px; }
.set .n{ font-size:12px; color:var(--dim); font-weight:700; text-align:center; }
.fld{ display:flex; align-items:center; height:46px; border-radius:14px; background:rgba(255,255,255,.8); border:1px solid var(--stroke); padding:0 10px; gap:6px; }
.fld:focus-within{ border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent); }
.fld input{ width:100%; min-width:0; border:0; outline:0; background:none; font-size:17px; font-weight:700; }
.fld input::placeholder{ color:var(--dim); font-weight:600; }
.fld span{ font-size:11.5px; color:var(--dim); }
.tlabel{ font-size:14px; color:var(--muted); }
.chk{ height:46px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(29,56,51,.04); display:grid; place-items:center; transition:all .2s; }
.chk svg{ width:20px; height:20px; opacity:.45; }
.set.done .chk{ background:var(--acc); border-color:var(--acc); box-shadow:0 0 16px -2px var(--acc); }
.set.done .chk svg{ opacity:1; color:#fff; }
.set.done .fld{ opacity:.7; }
.yt{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12.5px; font-weight:600; color:#d0624b; text-decoration:none; padding:7px 13px; border-radius:99px; background:rgba(236,134,112,.12); border:1px solid rgba(236,134,112,.3); }

.card{ padding:18px; margin-bottom:12px; }
.card h3{ font-family:var(--display); font-weight:700; font-size:18px; margin:0 0 4px; }
.card .hint{ color:var(--muted); font-size:13px; margin:0 0 14px; }

.pain-val{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
.pain-val b{ font-family:var(--display); font-size:40px; font-weight:800; line-height:1; color:var(--pc,var(--text)); text-shadow:0 0 20px var(--pc,transparent); }
.pain-val span{ color:var(--muted); font-size:13px; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:34px; background:none; }
input[type=range]::-webkit-slider-runnable-track{ height:8px; border-radius:99px; background:linear-gradient(90deg,#2a9d84,#f2c063 55%,#ec8670); }
input[type=range]::-moz-range-track{ height:8px; border-radius:99px; background:linear-gradient(90deg,#2a9d84,#f2c063 55%,#ec8670); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.15), 0 0 16px rgba(255,255,255,.5); }
input[type=range]::-moz-range-thumb{ width:26px; height:26px; border:0; border-radius:50%; background:#fff; box-shadow:0 0 16px rgba(255,255,255,.5); }
.scale{ display:flex; justify-content:space-between; font-size:11px; color:var(--dim); }

.btn{ width:100%; height:54px; border-radius:18px; border:1px solid color-mix(in srgb,var(--acc) 60%,transparent); background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff 15%),var(--acc)); color:#fff; font-weight:800; font-size:16px; box-shadow:0 10px 30px -8px var(--acc), inset 0 1px 0 rgba(255,255,255,.5); transition:transform .15s, opacity .2s; }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.35; box-shadow:none; }
.btn.ghost{ background:rgba(29,56,51,.05); color:var(--text); border-color:var(--stroke2); box-shadow:none; }
.btn.sm{ height:42px; width:auto; padding:0 16px; font-size:14px; border-radius:14px; }

.donecard{ text-align:center; padding:26px 18px; margin-bottom:12px; }
.donecard .big{ width:64px; height:64px; margin:0 auto 12px; border-radius:50%; background:var(--acc); color:#fff; display:grid; place-items:center; box-shadow:0 0 40px var(--acc); }
.donecard .big svg{ width:30px; height:30px; }
.donecard h2{ font-family:var(--display); font-size:24px; margin:0 0 4px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
.stat{ background:rgba(29,56,51,.04); border:1px solid var(--stroke); border-radius:16px; padding:12px 8px; text-align:center; }
.stat b{ display:block; font-family:var(--display); font-size:20px; font-weight:800; }
.stat span{ font-size:11.5px; color:var(--muted); }

/* progresso */
.sel{ width:100%; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.8); padding:0 14px; margin-bottom:12px; }
.chart{ width:100%; height:auto; display:block; }
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ display:flex; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--stroke); font-size:13.5px; }
.hist li:last-child{ border-bottom:0; }
.hist .d{ color:var(--muted); font-size:12.5px; }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--c); box-shadow:0 0 8px var(--c); }
.empty{ color:var(--muted); font-size:14px; text-align:center; padding:22px 8px; }

.ctx{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.ctx button{ height:38px; padding:0 14px; border-radius:99px; border:1px solid var(--stroke2); background:rgba(29,56,51,.04); font-size:13px; font-weight:600; }
.ctx button[aria-pressed=true]{ background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 0 14px -2px var(--acc); }
.alert{ padding:14px 16px; border-radius:18px; font-size:13.5px; margin-bottom:12px; border:1px solid; }
.alert.bad{ background:rgba(236,134,112,.12); border-color:rgba(236,134,112,.4); color:#a8472f; }
.alert.good{ background:rgba(42,157,132,.1); border-color:rgba(42,157,132,.3); color:#1d6f5c; }
.proto{ list-style:none; margin:0; padding:0; }
.proto li{ padding:10px 0; border-bottom:1px solid var(--stroke); font-size:13.5px; color:var(--muted); }
.proto li:last-child{ border-bottom:0; }
.proto b{ color:var(--text); font-weight:600; display:block; }

/* timer */
.timer{ position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); max-width:496px; margin:0 auto; padding:10px 10px 10px 14px; border-radius:22px; display:flex; align-items:center; gap:12px; z-index:20; transform:translateY(20px); opacity:0; pointer-events:none; transition:transform .3s, opacity .3s; }
.timer.on{ transform:none; opacity:1; pointer-events:auto; }
.timer.end{ border-color:var(--acc); box-shadow:0 0 36px -4px var(--acc); }
.ring{ width:44px; height:44px; flex-shrink:0; }
.timer .tt{ flex:1; }
.timer .tt b{ font-family:var(--display); font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; display:block; line-height:1.1; }
.timer .tt span{ font-size:12px; color:var(--muted); }
.tbtn{ height:40px; min-width:44px; padding:0 10px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(29,56,51,.06); font-size:13px; font-weight:700; }

/* nav */
nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:21; padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,rgba(230,243,238,0),rgba(245,232,222,.92) 45%); }
.brand{ display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.01em; color:var(--inf); margin-bottom:4px; }
.brand img{ width:34px; height:34px; border-radius:11px; box-shadow:0 2px 8px rgba(29,56,51,.12); }
.rules{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.rule{ padding:14px; border-radius:20px; }
.rule .e{ font-size:22px; line-height:1; margin-bottom:10px; }
.rule b{ display:block; font-size:14px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.rule p{ margin:0; font-size:12.5px; color:var(--muted); line-height:1.5; }
.why p{ margin:0 0 10px; color:var(--muted); font-size:14px; } .why p:last-child{ margin:0; }
.why strong{ color:var(--text); font-weight:600; }
.wk{ display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13.5px; margin-top:12px; }
.wk dt{ color:var(--dim); font-weight:700; } .wk dd{ margin:0; color:var(--muted); }
.wk dd i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--c); box-shadow:0 0 8px var(--c); }
@media (max-width:360px){ .rules{ grid-template-columns:1fr; } }
.tabs .in{ max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:6px; border-radius:24px; }
.tabs button{ height:52px; border:0; border-radius:18px; background:none; color:var(--muted); font-size:12px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:background .2s,color .2s; }
.tabs button svg{ width:20px; height:20px; }
.tabs button[aria-current=page]{ color:var(--text); background:color-mix(in srgb,var(--acc) 20%,transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent), 0 0 20px -6px var(--acc); }

/* ajustes */
.sheet{ position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; justify-content:center; background:rgba(29,56,51,.22); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.sheet.on{ display:flex; }
.sheet .panel{ width:100%; max-width:520px; padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px)); border-radius:28px 28px 0 0; background:#fbfdfc; }
.sheet h3{ font-family:var(--display); font-size:22px; margin:0 0 16px; }
.field{ margin-bottom:16px; }
.sheet .panel{ max-height:88vh; overflow-y:auto; }
.sheet h4{ font-family:var(--display); font-size:17px; margin:22px 0 10px; }
.optrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--stroke); }
.optrow p{ margin:0; font-size:14px; } .optrow small{ display:block; color:var(--muted); font-size:12.5px; }
.optrow .btn{ width:auto; flex-shrink:0; }
.bk{ width:100%; min-height:96px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.8); padding:10px 12px; font-size:12px; font-family:ui-monospace,monospace; resize:vertical; margin-bottom:8px; }
.field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:8px; }
.field input[type=date]{ width:100%; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.8); padding:0 14px; }
.row{ display:flex; gap:8px; }

.toast{ position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:50%; transform:translate(-50%,-20px); opacity:0; z-index:50; padding:11px 16px; border-radius:16px; font-size:13.5px; font-weight:600; transition:all .3s; pointer-events:none; white-space:nowrap; }
.toast.on{ transform:translate(-50%,0); opacity:1; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } #intro *{ animation:none !important; } }

/* calendário estilo check-in */
.cal-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-top h3{ margin:0; text-transform:capitalize; }
.cal-nav{ display:flex; gap:6px; }
.cal-nav button{ width:36px; height:36px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(29,56,51,.05); color:var(--text); font-size:18px; line-height:1; }
.cal-nav button:disabled{ opacity:.3; }
.cal-wk{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px; }
.cal-wk span{ text-align:center; font-size:11px; color:var(--dim); text-transform:lowercase; }
.cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
.cd{ position:relative; width:100%; min-width:0; height:auto; aspect-ratio:1/1; border-radius:14px; border:1px solid transparent; background:rgba(29,56,51,.035); color:var(--muted); font-family:var(--display); font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0; }
.cd.blank{ background:none; }
.cd.fut{ color:var(--dim); background:rgba(29,56,51,.015); }
.cd.today{ border-color:var(--stroke2); color:var(--text); }
.cd.on{ color:#fff; font-weight:800; border-color:color-mix(in srgb,var(--c) 70%,#fff 30%);
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 70%,#fff 30%),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000 30%));
  box-shadow:0 0 16px -2px var(--c), inset 0 1px 0 rgba(255,255,255,.45); animation:calpop .45s ease both; }
.cd.on.multi{ background:conic-gradient(var(--c) 0 50%, var(--c2) 50% 100%); }
.cd.sel{ outline:2px solid var(--text); outline-offset:2px; }
.cd .ball{ position:absolute; right:3px; bottom:3px; width:9px; height:9px; border-radius:50%; background:var(--cardio); box-shadow:0 0 8px var(--cardio); border:1.5px solid #fff; }
.cd:not(.on) .ball{ border-color:transparent; }
@keyframes calpop{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
.cal-leg{ display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:14px; font-size:12px; color:var(--muted); }
.cal-leg i{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); margin-right:6px; vertical-align:middle; }
.cal-day{ margin-top:14px; padding:14px; border-radius:16px; background:rgba(29,56,51,.04); border:1px solid var(--stroke); }
.cal-day b{ font-family:var(--display); }
.cal-day .row{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; color:var(--muted); }
.cal-day .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.cal-day .acts .btn{ flex:1; }
.ballsvg{ display:block; filter:drop-shadow(0 0 4px #ffb86b) drop-shadow(0 0 7px #a98bff); }
.cd .ball{ position:absolute; right:2px; bottom:2px; width:auto; height:auto; background:none; border:0; box-shadow:none; }
.wd .fb{ position:absolute; top:-5px; right:-3px; }
.futcard{ display:flex; align-items:center; gap:14px; }
.futcard .ico{ flex-shrink:0; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:rgba(29,56,51,.04); border:1px solid var(--stroke); }
.futcard.on .ico{ border-color:color-mix(in srgb,#ffb86b 60%,transparent); background:radial-gradient(circle,rgba(255,184,107,.18),rgba(169,139,255,.08)); }
.futcard .tx{ flex:1; min-width:0; }
.futcard .tx b{ display:block; font-family:var(--display); font-size:16px; }
.futcard .tx span{ font-size:12.5px; color:var(--muted); }
.futcard .btn{ width:auto; flex-shrink:0; }
.leg-ball{ display:inline-flex; vertical-align:middle; margin-right:6px; }
/* últimos 10 segundos do descanso: alerta vermelho pulsando */
.timer.warn{ border-color:#e5484d !important; box-shadow:0 0 36px -4px #e5484d !important; animation:tpulse 1s ease-in-out infinite; }
.timer.warn #tclock{ color:#e5484d; }
.timer.warn #tlabel{ color:#e5484d; opacity:.8; }
.timer.warn #ringfg{ stroke:#e5484d; }
@keyframes tpulse{ 50%{ box-shadow:0 0 56px 0 #e5484d; } }
.install{ display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:12px; }
.install .tx{ flex:1; font-size:13.5px; color:var(--muted); } .install .tx b{ display:block; color:var(--text); font-size:15px; }
.install .btn{ width:auto; flex-shrink:0; }
.optrow input[type=time]{ height:42px; border-radius:12px; border:1px solid var(--stroke2); background:var(--glass-a); padding:0 10px; color:var(--text); }
/* avaliação do treino */
.cal-ex{ list-style:none; margin:6px 0 2px; padding:0; font-size:12.5px; }
.cal-ex li{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; color:var(--muted); }
.cal-ex li span:first-child{ color:var(--text); }
.rv-in{ margin-top:12px; padding-top:12px; border-top:1px solid var(--stroke); }
.rv-t{ display:block; font-family:var(--display); font-size:15px; margin-bottom:4px; }
.rv-wrap{ position:relative; }
.rv-wrap .rv-ta{ padding-right:58px; }
.mic{ position:absolute; right:8px; bottom:18px; width:44px; height:44px; border-radius:50%; border:0; background:var(--acc); color:#fff; display:grid; place-items:center; box-shadow:0 8px 18px -8px var(--acc); }
.mic svg{ width:22px; height:22px; }
.mic.on{ background:#e5484d; box-shadow:0 0 0 0 rgba(229,72,77,.6); animation:micPulse 1.2s ease-out infinite; }
@keyframes micPulse{ to{ box-shadow:0 0 0 14px rgba(229,72,77,0); } }
.mic-st{ font-size:12px; color:var(--muted); margin:-4px 0 10px; }
.stars{ display:flex; align-items:center; gap:4px; margin:4px 0 10px; }
.stars button{ font-size:32px; line-height:1; background:none; border:0; padding:2px; color:color-mix(in srgb,var(--muted) 35%,transparent); transition:transform .15s,color .15s; }
.stars button.on{ color:#f2b33d; text-shadow:0 2px 10px rgba(242,179,61,.45); }
.stars button:active{ transform:scale(1.2); }
.stars .lbl{ margin-left:8px; font-size:13px; font-weight:700; color:var(--muted); }
.rv-ta{ width:100%; min-height:90px; border-radius:14px; border:1px solid var(--stroke2); background:var(--glass-a); padding:10px 12px; font:inherit; font-size:14px; color:var(--text); resize:vertical; margin:0 0 10px; }
.cm-item .st{ color:#f2b33d; letter-spacing:1px; } .cm-item .st span{ color:color-mix(in srgb,var(--muted) 35%,transparent); }
[data-theme=dark] .rv-ta{ background:rgba(255,255,255,.06); }
/* comentários nos exercícios */
.cm{ margin-top:12px; padding-top:12px; border-top:1px solid var(--stroke2); }
.cm textarea{ width:100%; min-height:78px; border-radius:14px; border:1px solid var(--stroke2); background:var(--glass-a); padding:10px 12px; font:inherit; font-size:14px; color:var(--text); resize:vertical; margin:8px 0; }
.cm .ctx{ margin:0; }
.cm .ctx button{ height:34px; font-size:12.5px; padding:0 12px; }
.cm-item{ padding:11px 12px; border-radius:14px; background:var(--glass-a); border:1px solid var(--stroke); margin-bottom:8px; font-size:13px; line-height:1.45; }
.cm-item .me b{ font-weight:700; }
.cm-item .tg{ color:var(--muted); font-size:12px; }
.cm-item .rp{ margin-top:8px; color:var(--muted); }
.cm-item .rp b{ color:var(--text); }
.cm-item .rp i{ font-style:normal; }
.cm-chg{ margin-top:10px; padding:10px 12px; border-radius:12px; background:color-mix(in srgb,var(--acc) 13%,transparent); border:1px solid color-mix(in srgb,var(--acc) 35%,transparent); color:var(--text); }
.cm-chg .row{ display:flex; gap:8px; margin-top:8px; }
.cm-chg .btn{ flex:1; }
.cm-new{ border-left:4px solid var(--acc); }
[data-theme=dark] .cm textarea, [data-theme=dark] .cm-item{ background:rgba(255,255,255,.06); }
/* seletor Treino | Ciclo dentro de Progresso */
.seg2{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; margin-bottom:12px; border-radius:18px; background:var(--glass-b); border:1px solid var(--stroke); }
.seg2 button{ height:42px; border:0; border-radius:14px; background:none; color:var(--muted); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:7px; }
.seg2 button svg{ width:18px; height:18px; }
.seg2 button[aria-selected=true]{ background:var(--acc); color:#fff; box-shadow:0 8px 18px -10px var(--acc); }
[data-theme=dark] .seg2{ background:rgba(255,255,255,.05); }
/* aba Ciclo */
.cy-hero{ display:flex; gap:16px; align-items:center; }
.cy-ring{ width:136px; height:136px; flex-shrink:0; position:relative; }
.cy-ring svg{ width:100%; height:100%; display:block; }
.cy-ring .ctr{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.cy-ring .ctr small{ font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.cy-ring .ctr b{ font-family:var(--display); font-size:34px; font-weight:800; line-height:1.05; }
.cy-ph{ display:inline-flex; align-items:center; gap:7px; font-weight:700; color:var(--c); font-size:15px; }
.cy-ph i{ width:10px; height:10px; border-radius:50%; background:var(--c); flex-shrink:0; }
.cy-next{ font-size:13px; color:var(--muted); margin-top:6px; line-height:1.45; }
.cy-next b{ color:var(--text); font-weight:600; }
.cy-acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.cy-acts .btn{ flex:1; min-width:140px; }
.cy-lbl{ font-size:13px; font-weight:700; color:var(--muted); margin:14px 0 8px; }
.emo{ display:flex; gap:6px; }
.emo button{ flex:1; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:var(--glass-a); font-size:22px; line-height:1; transition:transform .15s; }
.emo button[aria-pressed=true]{ background:color-mix(in srgb,var(--acc) 22%,transparent); border-color:var(--acc); transform:scale(1.06); }
.cy-tip{ border-left:4px solid var(--c); }
.cy-tip h3{ display:flex; align-items:center; gap:8px; }
.cal .cd.cy-m{ background:#e0607e; color:#fff; font-weight:800; }
.cal .cd.cy-mp{ box-shadow:inset 0 0 0 2px #e0607e; color:#e0607e; background:transparent; }
.cal .cd.cy-f{ background:color-mix(in srgb,#8e7cc3 22%,transparent); color:#6a55b3; }
.cal .cd.cy-o{ background:#8e7cc3; color:#fff; font-weight:800; }
.cal .cd.cy-t{ background:color-mix(in srgb,#ec8670 16%,transparent); }
.cal .cd .lg{ position:absolute; bottom:4px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor; opacity:.7; }
.cy-row{ display:grid; grid-template-columns:1fr 52px 52px 52px; gap:6px; align-items:center; padding:10px 0; border-bottom:1px solid var(--stroke2); font-size:13px; }
.cy-row:last-child{ border-bottom:0; }
.cy-row.h{ font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding-top:0; }
.cy-row span:not(:first-child){ text-align:center; font-variant-numeric:tabular-nums; }
.cy-ban{ display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:12px; width:100%; text-align:left; border:1px solid var(--stroke); color:inherit; }
.cy-ban .dot{ width:36px; height:36px; border-radius:12px; flex-shrink:0; display:grid; place-items:center; background:color-mix(in srgb,var(--c) 20%,transparent); color:var(--c); font-weight:800; font-size:13px; }
.cy-ban .tx{ flex:1; min-width:0; font-size:12.5px; color:var(--muted); line-height:1.4; }
.cy-ban .tx b{ display:block; color:var(--text); font-size:14px; }
.cy-hist li{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.field input.cy-num{ width:100%; height:48px; border-radius:14px; border:1px solid var(--stroke2); background:var(--glass-a); padding:0 14px; }
.cy-warn{ font-size:12px; color:var(--muted); text-align:center; margin:4px 8px 14px; line-height:1.5; }
[data-theme=dark] .emo button{ background:rgba(255,255,255,.06); }
[data-theme=dark] .cal .cd.cy-f{ color:#c3b6ec; }
/* mini player do Spotify */
.sp{ display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:12px; border-radius:22px; }
.sp .cv{ width:48px; height:48px; border-radius:12px; flex-shrink:0; background:var(--glass-a) center/cover; display:grid; place-items:center; }
.sp .tx{ flex:1; min-width:0; }
.sp .tx b{ display:block; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .tx span{ display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .tx i{ display:block; font-style:normal; color:var(--acc); font-size:11px; font-weight:700; letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .ctl{ display:flex; gap:4px; flex-shrink:0; }
.sp .ctl button{ width:42px; height:42px; border-radius:50%; border:1px solid var(--stroke2); background:var(--glass-a); display:grid; place-items:center; color:var(--text); }
.sp .ctl button.pp{ background:var(--acc); border-color:var(--acc); color:#fff; }
.sp .ctl svg{ width:18px; height:18px; }
/* tela de abertura */
#intro{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
  background:radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--acc) 22%, var(--bg)) 0%, var(--bg) 62%); transition:opacity .45s ease, visibility .45s ease; }
#intro.off{ opacity:0; visibility:hidden; pointer-events:none; }
#intro img{ width:172px; height:172px; border-radius:46px; box-shadow:0 18px 50px -14px color-mix(in srgb, var(--acc) 70%, transparent), 0 0 0 1px var(--stroke); animation:introPop .7s cubic-bezier(.2,.8,.2,1) both; }
#intro h1{ font-family:var(--display); font-weight:800; font-size:38px; letter-spacing:-.02em; margin:8px 0 0; color:var(--text); animation:introUp .6s .15s both; }
#intro p{ margin:0; max-width:290px; color:var(--muted); font-size:15px; line-height:1.45; animation:introUp .6s .25s both; }
#intro .chip{ margin-top:6px; font-size:13px; animation:introUp .6s .35s both; }
#intro .tap{ position:absolute; bottom:calc(36px + env(safe-area-inset-bottom,0px)); color:var(--dim); font-size:13px; letter-spacing:.04em; animation:introUp .6s .6s both, tapPulse 2s 1.2s ease-in-out infinite; }
@keyframes tapPulse{ 50%{ opacity:.45; } }
@keyframes introPop{ from{ transform:scale(.7); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes introUp{ from{ transform:translateY(10px); opacity:0; } to{ transform:none; opacity:1; } }

/* ---- Kika: identidade menta + salmão ---- */
body{ background:linear-gradient(165deg,#d9efe7 0%,#eef4ec 45%,#fbe3d4 100%) fixed; }
.orb{ filter:blur(80px); }
.orb.a{ background:#9fdcc9; opacity:.55; }
.orb.b{ background:#ffd1bd; opacity:.6; }
.orb.c{ background:#bfe6d8; opacity:.5; }
.grain{ display:none; }
.glass{ box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 14px 34px -18px rgba(40,95,82,.35); }
.top h1, .day-head h2{ font-weight:700; }
.btn{ border-radius:99px; background:var(--acc); border-color:transparent; box-shadow:0 12px 26px -12px var(--acc); font-weight:600; }
.btn.ghost{ background:rgba(255,255,255,.7); color:var(--text); border-color:var(--stroke2); }
.btn.sm{ border-radius:99px; }
.iconbtn{ border-radius:50%; background:rgba(255,255,255,.75); }
.tabs button[aria-current=page]{ color:#fff; background:var(--acc); box-shadow:0 8px 20px -10px var(--acc); }
.tabs .in{ border-radius:28px; }
.ctx button{ background:rgba(255,255,255,.7); }
.ctx button[aria-pressed=true]{ box-shadow:none; }
.wd{ background:rgba(255,255,255,.55); border-color:rgba(255,255,255,.9); border-radius:18px; }
.wd.sel{ background:color-mix(in srgb,var(--c) 16%,#fff); box-shadow:0 8px 20px -12px var(--c); }
.wd.done .s, .ex.complete .ex-st, .set.done .chk, .seg.on, .sbar i.on, .bar i, .hbar i{ box-shadow:none; }
.cd.on{ box-shadow:0 6px 14px -8px var(--c); background:var(--c); border-color:transparent; color:#fff; }
.cd{ background:rgba(255,255,255,.55); }
.cd.today{ border-color:var(--acc); }
.cal-leg i, .dot, .wk dd i{ box-shadow:none; }
.chip{ background:color-mix(in srgb,var(--c) 14%,#fff); }
.last em{ color:var(--sup); }
.pain-val b{ text-shadow:none; }
.timer{ background:rgba(255,255,255,.92); }
.timer.end{ border-color:var(--sup); box-shadow:0 0 30px -6px var(--sup); }
.donecard .big{ box-shadow:0 14px 30px -12px var(--acc); }
.care{ margin-bottom:12px; }
.care b{ font-weight:600; }
input[type=range]::-webkit-slider-thumb{ box-shadow:0 2px 8px rgba(29,56,51,.3); }

.useg{ display:flex; height:46px; padding:3px; border-radius:14px; border:1px solid var(--stroke2); background:rgba(255,255,255,.7); flex-shrink:0; }
.useg button{ width:36px; border:0; border-radius:11px; background:none; font-size:13px; font-weight:600; color:var(--muted); }
.useg button[aria-pressed=true]{ background:var(--acc); color:#fff; }
[data-theme=dark] .useg{ background:rgba(255,255,255,.07); }
/* ---- tema escuro ---- */
html[data-theme=dark]{ color-scheme:dark;
  --bg:#0f1f1b; --text:#e4efeb; --muted:#9ab0a8; --dim:#62776f;
  --stroke:rgba(255,255,255,.09); --stroke2:rgba(255,255,255,.15);
  --glass-a:rgba(34,58,51,.82); --glass-b:rgba(24,44,39,.66);
  --inf:#35b496; --sup:#f09580; --ok:#35b496; --warn:#e3a943; }
html[data-theme=light]{ color-scheme:only light; }
[data-theme=dark] body{ background:linear-gradient(165deg,#0e2520 0%,#121c1a 50%,#2a1c17 100%) fixed; }
[data-theme=dark] .orb.a{ background:#1f6453; opacity:.35; }
[data-theme=dark] .orb.b{ background:#7a3f2e; opacity:.3; }
[data-theme=dark] .orb.c{ background:#1d5246; opacity:.3; }
[data-theme=dark] .glass{ box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 14px 34px -18px rgba(0,0,0,.7); }
[data-theme=dark] .btn.ghost, [data-theme=dark] .iconbtn, [data-theme=dark] .ctx button, [data-theme=dark] .cal-nav button, [data-theme=dark] .tbtn{ background:rgba(255,255,255,.07); color:var(--text); border-color:var(--stroke2); }
[data-theme=dark] .ctx button[aria-pressed=true]{ background:var(--acc); border-color:var(--acc); color:#fff; }
[data-theme=dark] .wd{ background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.08); }
[data-theme=dark] .wd.sel{ background:color-mix(in srgb,var(--c) 22%,#15302a); }
[data-theme=dark] .chip{ background:color-mix(in srgb,var(--c) 20%,#15302a); }
[data-theme=dark] .cd{ background:rgba(255,255,255,.05); }
[data-theme=dark] .cd.fut{ background:rgba(255,255,255,.02); }
[data-theme=dark] .cd.on{ background:var(--c); color:#fff; }
[data-theme=dark] .bar, [data-theme=dark] .seg, [data-theme=dark] .hbar, [data-theme=dark] .sbar i{ background:rgba(255,255,255,.08); }
[data-theme=dark] .seg.on, [data-theme=dark] .sbar i.on, [data-theme=dark] .hbar i{ background:var(--acc); }
[data-theme=dark] .seg.cur{ background:color-mix(in srgb,var(--acc) 40%,transparent); }
[data-theme=dark] .last, [data-theme=dark] .chk, [data-theme=dark] .stat, [data-theme=dark] .cal-day, [data-theme=dark] .futcard .ico{ background:rgba(255,255,255,.05); border-color:var(--stroke); }
[data-theme=dark] .set.done .chk{ background:var(--acc); border-color:var(--acc); }
[data-theme=dark] .fld, [data-theme=dark] .sel, [data-theme=dark] .bk, [data-theme=dark] .field input, [data-theme=dark] #prior{ background:rgba(255,255,255,.07) !important; border-color:var(--stroke2) !important; color:var(--text); }
[data-theme=dark] input, [data-theme=dark] select, [data-theme=dark] textarea, [data-theme=dark] button{ color:var(--text); }
[data-theme=dark] .btn, [data-theme=dark] .tabs button[aria-current=page]{ color:#fff; }
[data-theme=dark] select option{ background:#15302a; }
[data-theme=dark] .timer{ background:rgba(22,40,36,.96); }
[data-theme=dark] .ring circle:first-child{ stroke:rgba(255,255,255,.12); }
[data-theme=dark] .sheet{ background:rgba(0,0,0,.5); }
[data-theme=dark] .sheet .panel{ background:#142824; }
[data-theme=dark] nav.tabs{ background:linear-gradient(180deg,rgba(15,31,27,0),rgba(18,28,26,.94) 45%); }
[data-theme=dark] .alert.bad{ background:rgba(240,149,128,.12); color:#f4ab99; }
[data-theme=dark] .alert.good{ background:rgba(53,180,150,.12); color:#86d9c3; }
[data-theme=dark] .yt{ color:#f4a593; }
[data-theme=dark] .brand{ color:var(--inf); }
[data-theme=dark] .cd .ball{ border-color:#15302a; }
.pref{ margin-bottom:16px; }
.pref label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:8px; }
</style>

<body>
<div class="bg" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="grain"></div></div>
<div id="intro" role="dialog" aria-label="Treino da Kika">
  <img src="icons/icon-512.png" alt="">
  <h1>Treino da Kika</h1>
  <p>4x por semana, joelho e lombar protegidos.</p>
  <span class="chip" id="introWk" style="--c:var(--acc)"></span>
  <small class="tap">Toque para começar</small>
</div>

const DAYS = ['seg','ter','qua','qui','sex','sab','dom'];
const DLABEL = {seg:'Seg',ter:'Ter',qua:'Qua',qui:'Qui',sex:'Sex',sab:'Sáb',dom:'Dom'};
const DFULL = {seg:'Segunda',ter:'Terça',qua:'Quarta',qui:'Quinta',sex:'Sexta',sab:'Sábado',dom:'Domingo'};
const ALLEX = {}; DAYS.forEach(d => PLAN[d].ex.forEach(e => { if(!ALLEX[e.id]) ALLEX[e.id] = e; }));

/* ---------- utilidades ---------- */
const z = n => String(n).padStart(2,'0');
const ymd = (d = new Date()) => d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a, b) => Math.round((parseYmd(ymd(a)) - parseYmd(ymd(b))) / 864e5);
const todayKey = () => DAYS[(new Date().getDay()+6)%7];
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtNum = n => (Math.round(n*10)/10).toLocaleString('pt-BR');
const LB = 2.20462;
const U = id => (S.program && S.program.units && S.program.units[id] === 'lb') ? 'lb' : 'kg';
const toU = (kg, id) => U(id) === 'lb' ? kg * LB : kg;
const fmtW = (kg, id) => fmtNum(toU(kg, id));
const r1 = n => Math.round(n*10)/10;
const wtUnit = (d, id) => (d.wtu && d.wtu[id]) || 'kg';
const wtKg = (d, id) => num(d.wt[id]) / (wtUnit(d, id) === 'lb' ? LB : 1);
function wtShow(d, id){ const raw = d.wt[id] ?? ''; if(raw === '') return ''; return wtUnit(d, id) === U(id) ? raw : String(r1(toU(wtKg(d, id), id))).replace('.', ','); }
function applyTheme(){
  const t = (S.program && S.program.theme) || 'light';
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = dark ? '#0f1f1b' : '#e3f2ec';
  const cs = document.querySelector('meta[name=color-scheme]'); if(cs) cs.content = dark ? 'dark' : 'only light';
}
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
const fmtDate = s => parseYmd(s).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.', '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const firstNum = s => parseInt(String(s), 10) || '';
const painColor = v => v <= 3 ? '#2a9d84' : v <= 6 ? '#d99a2b' : '#e0664f';
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const BALL = (sz=14) => `<svg class="ballsvg" width="${sz}" height="${sz}" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="11" fill="#ffb86b"/>${[0,120,240].map(a => `<path d="M0 0L${(11*Math.cos((a-30)*Math.PI/180)).toFixed(2)} ${(11*Math.sin((a-30)*Math.PI/180)).toFixed(2)}A11 11 0 0 1 ${(11*Math.cos((a+30)*Math.PI/180)).toFixed(2)} ${(11*Math.sin((a+30)*Math.PI/180)).toFixed(2)}Z" fill="#a98bff"/>`).join('')}<circle r="3.2" fill="#ffb86b"/><circle r="11" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.6"/></svg>`;
const ICON = {

  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

};

/* ---------- estado ---------- */
const S = {
  program:null, drafts:{}, sessions:[], pain:[],
  day: todayKey(), tab:'treino', open:{}, progEx:null,
  painCtx:'Joelho', painDraft:3, sync:'local'
};
const defaultProgram = () => ({ weeks:4, start: ymd(mondayOf(new Date())) });

/* ---------- armazenamento ---------- */
const LS = 'treino-erika-v1';
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({program:S.program, drafts:S.drafts, sessions:S.sessions, pain:S.pain, cycle:S.cycle})); }catch(e){} }

function savePain(p){ lsSave(); }

/* ---------- lógica ---------- */
const blankSets = ex => Array.from({length:ex.sets}, () => ({w:'', r:'', done:false}));
function draft(day){
  let d = S.drafts[day];
  if(!d || d.date !== ymd()){ d = S.drafts[day] = { date:ymd(), log:{}, pain:null, startedAt:null }; }
  if(!d.wt) d.wt = {};
  return d;
}
function exSets(d, ex){ if(!d.log[ex.id] || d.log[ex.id].length !== ex.sets) d.log[ex.id] = blankSets(ex); return d.log[ex.id]; }
const exDone = (d, ex) => { const s = d.log[ex.id]; return !!s && s.length === ex.sets && s.every(x => x.done); };
const sessionsDesc = () => [...S.sessions].sort((a,b) => b.finishedAt - a.finishedAt);
function lastFor(exId){ for(const s of sessionsDesc()){ const v = s.log && s.log[exId]; if(v && v.length) return v; } return null; }
const todaySession = day => sessionsDesc().find(s => s.date === ymd() && s.day === day);

function cycleInfo(){
  const P = S.program, start = parseYmd(P.start), total = P.weeks * 7;
  const elapsed = Math.max(0, Math.min(total, dayDiff(new Date(), start) + 1));
  const end = addDays(start, total);
  const inCycle = S.sessions.filter(s => { const d = parseYmd(s.date); return d >= start && d < end; });
  const planned = P.weeks * 4;
  return { week: Math.max(1, Math.min(P.weeks, Math.ceil(elapsed / 7) || 1)), weeks:P.weeks, elapsed, total, daysLeft: total - elapsed, done: inCycle.length + (P.prior || 0), planned, inCycle, ended: dayDiff(new Date(), start) >= total, notStarted: dayDiff(new Date(), start) < 0 };
}
function weekState(){
  const mon = mondayOf(new Date());
  return DAYS.map((k, i) => {
    const date = ymd(addDays(mon, i));
    const done = S.sessions.some(s => s.date === date && s.day === k);
    const dr = S.drafts[k];
    const part = !done && dr && dr.date === date && Object.values(dr.log).some(a => a.some(x => x.done));
    return { k, done, part, today: date === ymd() };
  });
}

/* ---------- gráfico ---------- */
let gid = 0;
function chart(pts, color, opt = {}){
  const W = 320, H = 160, p = {l:30, r:14, t:16, b:26};
  const ys = pts.map(q => q.y);
  let mn = opt.min ?? Math.min(...ys), mx = opt.max ?? Math.max(...ys);
  if(mn === mx){ mn -= 1; mx += 1; }
  const x = i => pts.length === 1 ? (p.l + (W-p.l-p.r)/2) : p.l + i*(W-p.l-p.r)/(pts.length-1);
  const y = v => p.t + (mx - v)*(H-p.t-p.b)/(mx - mn);
  const id = 'g' + (++gid);
  const line = pts.map((q,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(q.y).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-p.b) + ' L' + x(0).toFixed(1) + ' ' + (H-p.b) + ' Z';
  const grid = [mn, (mn+mx)/2, mx].map(v => `<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(29,56,51,.08)"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8a9c97">${fmtNum(v)}</text>`).join('');
  const dots = pts.map((q,i) => `<circle cx="${x(i)}" cy="${y(q.y)}" r="${pts.length > 20 ? 2.5 : 4}" fill="${q.c || color}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const labs = pts.length ? `<text x="${x(0)}" y="${H-6}" font-size="10" fill="#8a9c97" text-anchor="${pts.length===1?'middle':'start'}">${esc(pts[0].lab)}</text>` + (pts.length > 1 ? `<text x="${x(pts.length-1)}" y="${H-6}" font-size="10" fill="#8a9c97" text-anchor="end">${esc(pts[pts.length-1].lab)}</text>` : '') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Gráfico')}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>
    <filter id="${id}f" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${grid}${pts.length > 1 ? `<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" filter="url(#${id}f)"/>` : ''}${dots}${labs}</svg>`;
}

/* ---------- render ---------- */
const $app = document.getElementById('app');
function setAcc(){
  let c = PLAN[S.day].type === 'sup' ? TYPES.sup.c : TYPES.inf.c;
  if(S.tab === 'joelho') c = TYPES.sup.c;
  if(S.tab === 'progresso' || S.tab === 'guia') c = TYPES.inf.c;
  if(S.tab === 'progresso' && S.prog === 'ciclo') c = TYPES.sup.c;
  document.documentElement.style.setProperty('--acc', c);
}
function render(){
  setAcc();
  const ci = cycleInfo();
  const pct = Math.min(100, Math.round(ci.done / ci.planned * 100));
  const tpct = Math.round(ci.elapsed / ci.total * 100);
  const syncTxt = 'Salvo neste aparelho';
  let html = `

const dateOfDay = k => ymd(addDays(mondayOf(new Date()), DAYS.indexOf(k)));
const hasFut = date => false;
function futCard(day){
  const c = PLAN[day].care; if(!c) return '';
  return `<div class="alert care ${c.tone}"><b>${c.label}.</b> ${c.text}</div>`;
}
function viewTreino(){
  const day = S.day, plan = PLAN[day], T = TYPES[plan.type];
  const chips = `<div class="chips"><span class="chip" style="--c:${T.c}">${plan.tag || T.label}</span><span class="chip" style="--c:#62786f">${DFULL[day]}</span></div>`;
  if(!plan.ex.length){
    return `<section class="day-head glass">${chips}<h2>${plan.title}</h2><p>${plan.note}</p></section>${futCard(day)}
    <section class="card glass"><h3>Dia livre</h3><p class="hint">Se sentiu o joelho ou a lombar hoje, registre para acompanhar a evolução.</p><button class="btn ghost" data-act="tab" data-tab="joelho">Registrar dor</button></section>`;
  }
  const done = todaySession(day);
  if(done && !S.redo){
    const mins = done.startedAt ? Math.max(1, Math.round((done.finishedAt - done.startedAt)/60000)) : null;
    return `<section class="day-head glass">${chips}<h2>${plan.title}</h2></section>
    <section class="donecard glass"><div class="big">${ICON.check}</div><h2>Treino concluído</h2><p class="hint" style="color:var(--muted);margin:0">${DFULL[day]}, ${fmtDate(done.date)}</p>
      <div class="stats"><div class="stat"><b>${done.sets}</b><span>séries</span></div><div class="stat"><b>${fmtNum(done.volume)}</b><span>kg de volume</span></div><div class="stat"><b>${mins ? mins + 'min' : '—'}</b><span>duração</span></div></div>
      
      <button class="btn ghost" data-act="redo">Registrar outro treino hoje</button></section>${rvCard()}${futCard(day)}`;
  }
  const d = draft(day);
  const total = plan.ex.length, doneCount = plan.ex.filter(e => exDone(d, e)).length;
  const curIdx = plan.ex.findIndex(e => !exDone(d, e));
  if(S.open[day] === undefined) S.open[day] = curIdx === -1 ? null : plan.ex[curIdx].id;
  const anyDone = Object.values(d.log).some(a => a.some(x => x.done));
  let h = `<section class="day-head glass">${chips}<h2>${plan.title}</h2><p>${plan.note}</p>
    <div class="steps"><div class="steps-top"><b>${doneCount === total ? 'Tudo concluído' : `Etapa ${Math.min(doneCount+1,total)} de ${total}`}</b><span>${Math.round(doneCount/total*100)}%</span></div>
    <div class="segs">${plan.ex.map((e,i) => `<div class="seg ${exDone(d,e)?'on':''} ${i===curIdx?'cur':''}"></div>`).join('')}</div></div></section>${futCard(day)}`;
  plan.ex.forEach((ex, i) => {
    const sets = exSets(d, ex), complete = exDone(d, ex), open = S.open[day] === ex.id;
    const doneSets = sets.filter(s => s.done).length;
    const last = lastFor(ex.id);
    const best = last && ex.kind !== 'time' ? last.reduce((a,b) => (b.w > a.w || (b.w === a.w && b.r > a.r)) ? b : a) : null;
    h += `<article class="ex glass ${complete?'complete':''} ${open?'open':''}">
      <button class="ex-h" data-act="open" data-ex="${ex.id}" aria-expanded="${open}">
        <span class="ex-st">${complete ? ICON.check.replace('<svg','<svg width="15" height="15"') : i+1}</span>
        <span class="ex-t"><div class="n">${ex.star ? '★ ' : ''}${esc(ex.name)}</div><div class="m">${ex.sets} × ${ex.reps}${doneSets && !complete ? ` · ${doneSets}/${ex.sets} feitas` : ''}</div><span class="hbar" aria-hidden="true"><i style="width:${Math.round(doneSets/ex.sets*100)}%"></i></span></span>
        <span class="chev">▼</span>
      </button>
      <div class="ex-b">
        <p class="obs">${esc(ex.obs)}</p>
        ${best ? `<div class="last">Última vez: <em>${best.w ? fmtW(best.w, ex.id) + ' ' + U(ex.id) + ' × ' : ''}${best.r} reps</em></div>` : ''}
        ${ex.kind !== 'time' ? `<div class="wrow"><span class="lbl">Carga<small>Vale para todas as séries</small></span><label class="fld"><input inputmode="decimal" data-k="w" data-ex="${ex.id}" value="${esc(wtShow(d, ex.id))}" placeholder="${best && best.w ? fmtW(best.w, ex.id) : '0'}" aria-label="Carga do exercício em ${U(ex.id) === 'lb' ? 'libras' : 'quilos'}"></label><div class="useg" role="group" aria-label="Unidade da carga">${['kg','lb'].map(u => `<button data-act="wunit" data-ex="${ex.id}" data-v="${u}" aria-pressed="${U(ex.id)===u}">${u}</button>`).join('')}</div></div>` : ''}
        <div class="sprog"><div class="sprog-top"><span>${ex.sets} × ${esc(ex.reps)}</span><b>${doneSets} de ${ex.sets} séries</b></div>
          <div class="sbar" role="progressbar" aria-valuenow="${doneSets}" aria-valuemin="0" aria-valuemax="${ex.sets}" aria-label="Séries concluídas">${sets.map(s => `<i class="${s.done?'on':''}"></i>`).join('')}</div></div>
        <div class="srow">
          ${complete ? `<button class="btn ok" disabled>${ICON.check}Exercício concluído</button>` : `<button class="btn" data-act="nextset" data-ex="${ex.id}">${ICON.check}Concluir série ${doneSets+1} de ${ex.sets}</button>`}
          ${doneSets ? `<button class="tbtn undo" data-act="undoset" data-ex="${ex.id}">Desfazer</button>` : ''}
        </div>
        ${ex.yt ? `<a class="yt" href="${YT(ex.yt)}" target="_blank" rel="noopener">▶ Ver execução</a>` : ''}
      </div></article>`;
  });
  const pv = d.pain;
  h += `<section class="card glass" style="margin-top:14px"><h3>Como ficou o corpo hoje?</h3><p class="hint">Opcional. Dor no joelho ou na lombar durante o treino, de 0 a 10.</p>
    <div class="pain-val" style="--pc:${pv==null?'var(--dim)':painColor(pv)}"><b>${pv==null?'–':pv}</b><span>${pv==null?'Arraste para registrar':'de 10'}</span></div>
    <input type="range" min="0" max="10" step="1" value="${pv==null?0:pv}" data-k="pain" aria-label="Dor de 0 a 10"><div class="scale"><span>Sem dor</span><span>Dor forte</span></div></section>
    <button class="btn" data-act="finish" ${anyDone?'':'disabled'}>${doneCount === total ? 'Concluir treino' : anyDone ? `Concluir com ${doneCount} de ${total} exercícios` : 'Marque uma série para concluir'}</button>` + (S.day === todayKey() ? rvCard() : '');
  return h;
}


/* ---------- calendário de check-ins ---------- */
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DAY_BY_JS = ['dom','seg','ter','qua','qui','sex','sab'];
const futDates = () => new Set();
function checkinStats(){
  const dates = new Set(S.sessions.map(s => s.date)), fut = futDates();
  fut.forEach(d => dates.add(d));
  const mins = S.sessions.reduce((a,s) => a + (s.startedAt && s.finishedAt ? Math.min(240, (s.finishedAt - s.startedAt)/60000) : 0), 0);
  // sequência de semanas com 4+ check-ins (contando a atual se já bateu ou ainda está em andamento)
  let streak = 0, cur = 0;
  const mon = mondayOf(new Date());
  for(let w = 0; w < 104; w++){
    const m = addDays(mon, -7*w); let n = 0;
    for(let i = 0; i < 7; i++) if(dates.has(ymd(addDays(m, i)))) n++;
    if(w === 0){ cur = n; if(n >= 4) streak++; continue; }
    if(n >= 4) streak++; else break;
  }
  return { checkins: S.sessions.length + fut.size, days: dates.size, mins: Math.round(mins), streak, cur };
}
function viewCalendar(){
  const now = new Date();
  const off = S.calM || 0;
  const first = new Date(now.getFullYear(), now.getMonth() + off, 1);
  const y = first.getFullYear(), m = first.getMonth();
  const nDays = new Date(y, m + 1, 0).getDate();
  const byDate = {}; S.sessions.forEach(s => (byDate[s.date] = byDate[s.date] || []).push(s));
  const fut = futDates(), today = ymd();
  const st = checkinStats();
  const hh = Math.floor(st.mins/60), mm = st.mins % 60;
  let monthCount = 0;
  let cells = '';
  for(let i = 0; i < first.getDay(); i++) cells += '<span class="cd blank"></span>';
  for(let d = 1; d <= nDays; d++){
    const key = ymd(new Date(y, m, d)), ss = byDate[key] || [], f = fut.has(key);

/* ---------- ciclo menstrual (dados só no aparelho) ----------
   Fases estimadas pela média dos ciclos registrados (ou 28 dias até ter histórico):
   menstrual (dias de fluxo) · folicular · período fértil (ovulação −5 a +1) · ovulação (≈ duração − 14) · lútea · TPM (últimos 6 dias).
   Não é método contraceptivo nem diagnóstico. */
const CY_PH = {
  menstrual:{ c:'#e0607e', label:'Menstruação' },
  folicular:{ c:'#2a9d84', label:'Fase folicular' },
  fertil:{ c:'#8e7cc3', label:'Período fértil' },
  ovulacao:{ c:'#7a62c9', label:'Ovulação (estimada)' },
  lutea:{ c:'#d9953f', label:'Fase lútea' },
  tpm:{ c:'#ec8670', label:'TPM' },
  atraso:{ c:'#b56576', label:'Menstruação atrasada' }
};
const CY_TIP = {
  menstrual:['Ouça o corpo','Energia pode estar mais baixa. Se estiver bem, treine normal. Com cólica ou lombar sensível, reduza a carga, fique na ativação com elástico e capriche no core sem flexionar a coluna.'],
  folicular:['Fase boa para progredir','Energia e recuperação em alta. É a melhor fase para tentar subir carga ou repetições, sempre respeitando os 90° no joelho.'],
  fertil:['Força em alta, joelho no controle','O estrogênio alto aumenta a força, mas deixa ligamentos mais frouxos. Movimento lento e controlado, joelho alinhado com o elástico e nada de carga máxima.'],
  ovulacao:['Pico de força, cuidado com o joelho','Dia de mais força, e também de articulações mais frouxas. Mantenha a técnica impecável nos exercícios de perna.'],
  lutea:['Mantenha, sem forçar','O corpo esquenta e o esforço parece maior. Repita as cargas da semana anterior, hidrate-se bem e foque na técnica.'],
  tpm:['Tudo bem ir mais leve','Inchaço, cansaço e sensibilidade são comuns. Reduzir carga ou uma série não atrapalha: constância vale mais que intensidade.'],
  atraso:['Ciclo atrasado','Pode ser estresse, sono ou treino. Se o atraso continuar ou vier com sintomas diferentes, vale falar com o ginecologista.']
};
const CY_SYM = [['colica','Cólica'],['inchaco','Inchaço'],['cabeca','Dor de cabeça'],['lombar','Lombar'],['seios','Seios sensíveis'],['acne','Acne'],['sono','Sono ruim'],['ansiedade','Ansiedade'],['fome','Mais fome'],['libido','Libido alta']];
const CY_NA = { menstrual:'na <b>menstruação</b>', folicular:'na <b>fase folicular</b>', fertil:'no <b>período fértil</b>', lutea:'na <b>fase lútea</b>', tpm:'na <b>TPM</b>' };
const CY_E = ['😫','😕','😐','🙂','🤩'], CY_M = ['😢','😟','😐','😊','😄'];
const cyDefault = () => ({ periods:[], logs:{}, len:28, plen:5 });
const cyStarts = () => S.cycle.periods.map(p => p.start).sort();
const cyAvg = a => a.reduce((x, y) => x + y, 0) / a.length;
function cyStats(){
  const st = cyStarts(), diffs = [];
  for(let i = 1; i < st.length; i++){ const d = dayDiff(parseYmd(st[i]), parseYmd(st[i-1])); if(d >= 20 && d <= 45) diffs.push(d); }
  const l6 = diffs.slice(-6);
  const pl = S.cycle.periods.filter(p => p.end).map(p => dayDiff(parseYmd(p.end), parseYmd(p.start)) + 1).filter(x => x >= 2 && x <= 10).slice(-6);
  return { len: l6.length ? Math.round(cyAvg(l6)) : S.cycle.len, plen: pl.length ? Math.round(cyAvg(pl)) : S.cycle.plen, n: l6.length };
}
function cyPhase(day, clen, mlen){
  const ov = clen - 14;
  if(day <= mlen) return 'menstrual';
  if(day === ov) return 'ovulacao';
  if(day >= ov - 5 && day <= ov + 1) return 'fertil';
  if(day < ov) return 'folicular';
  if(day > clen - 6) return 'tpm';
  return 'lutea';
}
// informação de um dia: dia do ciclo, fase, se é previsão e se está atrasada
function cyInfo(dateStr){
  const st = cyStarts(); if(!st.length) return null;
  const stats = cyStats(), today = ymd();
  let i = -1; st.forEach((x, k) => { if(x <= dateStr) i = k; });
  if(i < 0) return null;
  let start = st[i];
  let clen = i + 1 < st.length ? dayDiff(parseYmd(st[i+1]), parseYmd(start)) : stats.len;
  let day = dayDiff(parseYmd(dateStr), parseYmd(start)) + 1, predicted = dateStr > today, late = 0;
  const isLast = i + 1 >= st.length;
  if(isLast && day > clen){
    const lateNow = Math.max(0, dayDiff(parseYmd(today), parseYmd(start)) + 1 - clen);
    if(dateStr <= today) late = day - clen;
    else {
      const s0 = addDays(parseYmd(start), clen + lateNow), k = dayDiff(parseYmd(dateStr), s0);
      if(k < 0) late = day - clen;
      else { start = ymd(addDays(s0, Math.floor(k / stats.len) * stats.len)); day = (k % stats.len) + 1; clen = stats.len; }
    }
  }
  const per = S.cycle.periods.find(p => p.start === start);
  let mlen;
  if(per && per.end) mlen = dayDiff(parseYmd(per.end), parseYmd(start)) + 1;
  else if(per && !per.end) mlen = Math.min(10, Math.max(stats.plen, dayDiff(parseYmd(today), parseYmd(start)) + 1));
  else mlen = stats.plen;
  const ph = late ? 'atraso' : cyPhase(day, clen, mlen);
  return { day, clen, mlen, start, ph, predicted: predicted || !per, late, ov: clen - 14, real: !!per };
}
const cyOngoing = () => S.cycle.periods.find(p => !p.end && dayDiff(new Date(), parseYmd(p.start)) < 10);
function cyNext(){
  const t = cyInfo(ymd()); if(!t) return null;
  const stats = cyStats();
  const nextStart = t.late ? null : addDays(parseYmd(t.start), t.clen);
  let fs = addDays(parseYmd(t.start), t.ov - 6), fe = addDays(parseYmd(t.start), t.ov);
  if(fe < parseYmd(ymd())){ const ns = nextStart || new Date(); fs = addDays(ns, stats.len - 20); fe = addDays(ns, stats.len - 14); }
  return { t, nextStart, fs, fe, days: nextStart ? dayDiff(nextStart, new Date()) : null };
}
function cyRing(t){
  const R = 54, C = 2 * Math.PI * R, n = t.clen, seg = C / n, gap = Math.min(2.2, seg * .25);
  let arcs = '';
  for(let d = 1; d <= n; d++){
    const ph = cyPhase(d, n, t.mlen), off = -(d - 1) * seg;
    arcs += `<circle cx="68" cy="68" r="${R}" fill="none" stroke="${CY_PH[ph].c}" stroke-width="${d === t.day ? 16 : 11}" stroke-dasharray="${(seg - gap).toFixed(2)} ${(C - seg + gap).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" opacity="${d === t.day ? 1 : d < t.day ? .9 : .38}" transform="rotate(-90 68 68)"/>`;
  }
  const a = ((Math.min(t.day, n) - .5) / n) * 2 * Math.PI - Math.PI / 2;
  const mx = 68 + R * Math.cos(a), my = 68 + R * Math.sin(a);
  return `<svg viewBox="0 0 136 136" role="img" aria-label="Dia ${t.day} de ${n} do ciclo">${arcs}<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6" fill="#fff" stroke="${CY_PH[t.ph].c}" stroke-width="3"/></svg>`;
}
function cyBanner(){
  if(!S.cycle || !S.cycle.periods.length) return '';
  const t = cyInfo(ymd()); if(!t) return '';
  const P = CY_PH[t.ph], tip = CY_TIP[t.ph];
  return `<button class="cy-ban glass" style="--c:${P.c}" data-act="tab" data-tab="progresso" data-prog="ciclo"><span class="dot">${t.late ? '+' + t.late : t.day}</span><span class="tx"><b>${P.label}${t.late ? '' : ' · dia ' + t.day}</b>${tip[0]}: ${tip[1].split('. ')[0]}.</span><span class="chev">›</span></button>`;
}

  h += `<section class="card glass"><div class="cy-hero">
      <div class="cy-ring">${cyRing(t)}<div class="ctr"><small>${t.late ? 'atraso' : 'dia'}</small><b>${t.late ? '+' + t.late : t.day}</b><small>${t.late ? 'dias' : 'de ' + t.clen}</small></div></div>
      <div><span class="cy-ph" style="--c:${P.c}"><i></i>${P.label}</span>

function cyCalendar(){

function cyInsights(){

  S.pain.forEach(x => { const g = gOf(x.date); if(g) G[g].pain.push(x.value); });
  Object.entries(S.cycle.logs).forEach(([d, l]) => { const g = gOf(d); if(g && l.e) G[g].e.push(l.e); });

    return h + `<p class="hint" style="margin:0">Aqui aparece como o ciclo mexe com o seu treino: treinos feitos, energia e dor em cada fase. Continue treinando e fazendo o check-in. Em algumas semanas os padrões começam a aparecer.</p></section>`;

}

// cadeia de áudio: tudo passa por ganho alto + compressor (soa bem mais alto sem estourar)
function unlockAudio(){
  try{
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = .001; comp.release.value = .08;
      amaster = actx.createGain(); amaster.gain.value = 2.2;
      amaster.connect(comp); comp.connect(actx.destination);
    }
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function tone(f, t, dur, vol = 1, type = 'square'){
  const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + t;
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(amaster);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01);
  g.gain.setValueAtTime(vol, t0 + dur - .03); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + .02);
}
// bipe curto da contagem 3, 2, 1
function countBeep(){ try{ if(actx){ unlockAudio(); tone(1046, 0, .12, .7); } }catch(e){} try{ navigator.vibrate && navigator.vibrate(90); }catch(e){} }
// alarme do fim do descanso: 3 pares de bipes agudos
function beep(){
  try{ if(actx){ unlockAudio(); for(let i = 0; i < 3; i++){ tone(1318, i*.45, .16, 1); tone(1760, i*.45 + .18, .2, 1); } } }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([400,120,400,120,700]); }catch(e){}
}

async function subscribePush(){
  try{
    if(Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted'){ toast('Permita notificações pra receber o lembrete'); return; }
    const reg = await pushReg(), key = b64u(VAPID);
    let sub = await reg.pushManager.getSubscription();
    if(sub && sub.options && sub.options.applicationServerKey && bytesToB64(sub.options.applicationServerKey) !== bytesToB64(key)){ await sub.unsubscribe(); sub = null; }
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:key });
    await syncPush(sub);
    S.pushOn = true; localStorage.setItem('treino-push-on', '1'); localStorage.removeItem('treino-push');
    renderSheet(); toast('Lembretes ativados');

}

let WL = null;
async function wakeOn(){
  try{ if(S.program.wake === false || !('wakeLock' in navigator) || WL || document.hidden) return; WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); }catch(e){}
}
function wakeOff(){ try{ WL && WL.release(); }catch(e){} WL = null; }
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  if(TM.int) tick();
  const d = S.drafts[S.day]; if(d && d.date === ymd() && Object.values(d.log || {}).some(a => a.some(x => x.done))) wakeOn();
});
function startTimer(sec, next = ''){ if(!sec) return; TM.total = sec; TM.end = Date.now() + sec*1000; TM.next = next; TM.lastSec = -1; clearInterval(TM.int); TM.int = setInterval(tick, 200); tick(); scheduleRest(); }
function stopTimer(){ clearInterval(TM.int); TM.int = null; const el = document.getElementById('timer'); el.classList.remove('on','end','warn'); cancelRest(); }
function tick(){
  const el = document.getElementById('timer');
  const left = Math.max(0, Math.ceil((TM.end - Date.now())/1000));
  el.classList.add('on');
  document.getElementById('tclock').textContent = Math.floor(left/60) + ':' + z(left%60);
  document.getElementById('ringfg').setAttribute('stroke-dashoffset', (119.4 * (1 - left / TM.total)).toFixed(1));
  el.classList.toggle('warn', left > 0 && left <= 10);
  if(left > 0 && left <= 3 && left !== TM.lastSec && !document.hidden) countBeep();
  TM.lastSec = left;
  if(left <= 0){
    clearInterval(TM.int); TM.int = null;
    el.classList.add('end'); document.getElementById('tlabel').textContent = 'Próxima série';
    beep(); setTimeout(() => { if(!TM.int){ el.classList.remove('on','end','warn'); } }, 4000);
  } else { el.classList.remove('end'); document.getElementById('tlabel').textContent = left <= 10 ? 'Prepare-se' : 'Descanso'; }
}

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act === 'day'){ S.day = b.dataset.day; S.redo = false; render(); }
  else if(act === 'tab'){ S.tab = b.dataset.tab; if(b.dataset.prog) S.prog = b.dataset.prog; render(); window.scrollTo({top:0}); }
  else if(act === 'prog'){ S.prog = b.dataset.v; render(); }
  else if(act === 'open'){ S.open[S.day] = S.open[S.day] === b.dataset.ex ? null : b.dataset.ex; render(); }
  else if(act === 'nextset' || act === 'undoset'){
    unlockAudio();
    const plan = PLAN[S.day], ex = plan.ex.find(x => x.id === b.dataset.ex);
    const d = draft(S.day), sets = exSets(d, ex);
    if(act === 'undoset'){ const k = sets.map(x => x.done).lastIndexOf(true); if(k >= 0) sets[k].done = false; stopTimer(); saveDrafts(); render(); return; }
    wakeOn(); askNotifOnce();
    const i = sets.findIndex(x => !x.done); if(i < 0) return;
    const s = sets[i];
    s.done = true;
    if(s.done){
      if(!d.startedAt) d.startedAt = Date.now();
      if(ex.kind !== 'time'){
        const last = lastFor(ex.id), ph = last ? (last[i] || last[last.length-1]) : null;
        if((d.wt[ex.id] ?? '') === '' && ph && ph.w){ d.wt[ex.id] = String(r1(toU(ph.w, ex.id))).replace('.', ','); (d.wtu = d.wtu || {})[ex.id] = U(ex.id); }
        if(s.r === '') s.r = String(ph && ph.r ? ph.r : firstNum(ex.reps));
      }
      if(exDone(d, ex)){
        const next = plan.ex.find(x => !exDone(d, x));
        S.open[S.day] = next ? next.id : null;
        if(ex.rest && next) startTimer(ex.rest, next.name);
      } else startTimer(ex.rest, ex.name + ' · série ' + (i+2));
    }
    saveDrafts(); render();
  }
  else if(act === 'finish'){
    const plan = PLAN[S.day], d = draft(S.day), log = {};
    let sets = 0, volume = 0;
    plan.ex.forEach(ex => {
      const done = (d.log[ex.id] || []).filter(s => s.done);
      if(!done.length) return;
      log[ex.id] = done.map(s => ex.kind === 'time' ? {w:0, r:0} : {w:r1(wtKg(d, ex.id)*100)/100, r:num(s.r)});
      sets += done.length; volume += log[ex.id].reduce((a,s) => a + s.w*s.r, 0);
    });
    const sess = { id:uid('s'), day:S.day, date:d.date, startedAt:d.startedAt, finishedAt:Date.now(), log, sets, volume:Math.round(volume), pain:d.pain };
    S.sessions.push(sess); saveSession(sess); markTrained();
    if(d.pain != null){ const p = { id:uid('p'), date:d.date, ts:Date.now(), value:d.pain, ctx:'Pós-treino' }; S.pain.push(p); savePain(p); }
    delete S.drafts[S.day]; S.open[S.day] = undefined; S.redo = false;
    saveDrafts(); stopTimer(); render(); window.scrollTo({top:0, behavior:'smooth'}); toast('Treino concluído');
  }
  else if(act === 'redo'){ S.redo = true; S.drafts[S.day] = null; S.open[S.day] = undefined; render(); }
  else if(act === 'calm'){ S.calM = Math.min(0, (S.calM||0) + +b.dataset.d); S.calSel = null; render(); }
  else if(act === 'calday'){ S.calSel = S.calSel === b.dataset.date ? null : b.dataset.date; render(); }
  else if(act === 'futtoggle'){ const f = S.program.fut = S.program.fut || [], k = b.dataset.date, i = f.indexOf(k); if(i >= 0) f.splice(i, 1); else f.push(k); saveProgram(); render(); toast(i >= 0 ? 'Futevôlei removido' : 'Futevôlei registrado 🏐'); }
  else if(act === 'calfut'){ const f = S.program.fut = S.program.fut || [], k = b.dataset.date, i = f.indexOf(k); if(i >= 0) f.splice(i, 1); else f.push(k); saveProgram(); render(); toast(i >= 0 ? 'Futevôlei removido' : 'Futevôlei registrado'); }
  else if(act === 'calmark'){ const k = b.dataset.date, t = parseYmd(k).setHours(19,0,0,0); const sess = { id:uid('s'), day:b.dataset.day, date:k, startedAt:null, finishedAt:t, log:{}, sets:0, volume:0, pain:null, manual:true }; S.sessions.push(sess); saveSession(sess); render(); toast('Check-in registrado'); }
  else if(act === 'calunmark'){ const k = b.dataset.date; S.sessions = S.sessions.filter(s => !(s.manual && s.date === k)); lsSave(); render(); toast('Registro removido'); }
  else if(act === 'ctx'){ S.painCtx = b.dataset.ctx; render(); }
  else if(act === 'savepain'){ const p = { id:uid('p'), date:ymd(), ts:Date.now(), value:S.painDraft, ctx:S.painCtx }; S.pain.push(p); savePain(p); render(); toast('Registro salvo'); }
  else if(act === 'settings'){ renderSheet(); document.getElementById('sheet').classList.add('on'); }
  else if(act === 'push'){ subscribePush(); }
  else if(act === 'pushtest'){ pushTest(); }
  else if(act === 'rv-star'){ S.rvStars = +b.dataset.v; document.querySelectorAll('[data-act="rv-star"]').forEach(x => { const v = +x.dataset.v; x.classList.toggle('on', v <= S.rvStars); x.setAttribute('aria-checked', v === S.rvStars); }); const l = document.getElementById('rv-lbl'); if(l) l.textContent = ['','Ruim','Fraco','Ok','Bom','Ótimo'][S.rvStars]; }
  else if(act === 'rv-send'){ rvSend(b.dataset.day || S.day, b.dataset.date || ymd()); }
  else if(act === 'rv-mic'){ micToggle(b); }
  else if(act === 'rv-again'){ S.rvAgain = b.dataset.date || ymd(); render(); }
  else if(act === 'cm-yes' || act === 'cm-no'){ cmDecide(b.dataset.id, act === 'cm-no'); }
  else if(act === 'cm-seen'){ S.notes.filter(n => n.claude).forEach(n => S.cmSeen.add(n.id)); cmSave(); render(); }
  else if(act === 'cy-first'){
    const d = document.getElementById('cyFirst').value || ymd();
    S.cycle.len = Math.min(45, Math.max(20, parseInt(document.getElementById('cyLen0').value, 10) || 28));
    S.cycle.plen = Math.min(10, Math.max(2, parseInt(document.getElementById('cyPlen0').value, 10) || 5));
    S.cycle.periods.push({ start:d }); if(dayDiff(new Date(), parseYmd(d)) >= S.cycle.plen) S.cycle.periods[0].end = ymd(addDays(parseYmd(d), S.cycle.plen - 1));
    lsSave(); render(); toast('Ciclo configurado');
  }
  else if(act === 'cy-start'){ cyAddStart(ymd()); }
  else if(act === 'cy-end'){ cyEnd(ymd()); }
  else if(act === 'cy-other'){ S.cyOther = !S.cyOther; render(); }
  else if(act === 'cy-start-at'){ const v = document.getElementById('cyDate').value; if(v) cyAddStart(v); }
  else if(act === 'cy-end-at'){ const v = document.getElementById('cyDate').value; if(v) cyEnd(v); }
  else if(act === 'cy-del'){ if(confirm('Apagar este registro de menstruação?')){ S.cycle.periods = S.cycle.periods.filter(p => p.start !== b.dataset.start); lsSave(); render(); toast('Registro apagado'); } }
  else if(act === 'cy-calm'){ S.cyM = Math.min(3, (S.cyM || 0) + +b.dataset.d); render(); }
  else if(act === 'cy-log'){ const L = S.cycle.logs[ymd()] = S.cycle.logs[ymd()] || {}; const f = b.dataset.f, v = f === 'flow' ? b.dataset.v : +b.dataset.v; L[f] = L[f] === v ? undefined : v; lsSave(); render(); }
  else if(act === 'cy-sym'){ const L = S.cycle.logs[ymd()] = S.cycle.logs[ymd()] || {}; const k = b.dataset.s, a = L.sym = L.sym || []; const i = a.indexOf(k); if(i >= 0) a.splice(i, 1); else a.push(k); lsSave(); render(); }
  else if(act === 'sp-on'){ spConnect(); }
  else if(act === 'sp-off'){ SP.tok = null; SP.now = null; spSave(); clearInterval(SP.poll); renderSheet(); render(); toast('Spotify desconectado'); }
  else if(act.startsWith('sp-')){ spCmd(act); }
  else if(act === 'pushoff'){ pushOff(); }
  else if(act === 'notif'){ if('Notification' in window) Notification.requestPermission().then(() => { renderSheet(); if(Notification.permission === 'granted') toast('Aviso do descanso ativado'); }); }
  else if(act === 'testrest'){ swPost({ type:'rest', end:Date.now() + 5000, total:5, next:'teste do aviso', force:true }).then(ok => toast(ok ? 'Bloqueie a tela: o aviso chega em 5 s' : 'Service worker ainda não está ativo. Recarregue o app.')); }
  else if(act === 'testsound'){ unlockAudio(); beep(); }
  else if(act === 'install'){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); renderSheet(); }); } }
  else if(act === 'hideinstall'){ S.program.hideInstall = true; saveProgram(); render(); }
  else if(act === 'wake'){ S.program.wake = S.program.wake === false; saveProgram(); if(S.program.wake === false) wakeOff(); renderSheet(); }
  else if(act === 'export'){
    const txt = JSON.stringify({app:'treino-erika', v:1, program:S.program, sessions:S.sessions, pain:S.pain, cycle:S.cycle});
    const ta = document.getElementById('bk'); ta.value = txt; ta.select();
    const ok = () => toast('Backup copiado. Cole na outra versão do app.');
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, () => toast('Selecionado. Copie o texto da caixa.')); else { try{ document.execCommand('copy'); ok(); }catch(e){ toast('Selecionado. Copie o texto da caixa.'); } }
  }
  else if(act === 'import'){
    let B; try{ B = JSON.parse(document.getElementById('bk').value.trim()); }catch(e){ toast('Backup inválido. Cole o texto completo.'); return; }
    if(!B || B.app !== 'treino-erika'){ toast('Esse texto não é um backup do app.'); return; }
    const ms = new Map(S.sessions.map(x => [x.id, x])); (B.sessions || []).forEach(x => ms.set(x.id, x)); S.sessions = [...ms.values()];
    const mp = new Map(S.pain.map(x => [x.id, x])); (B.pain || []).forEach(x => mp.set(x.id, x)); S.pain = [...mp.values()];
    if(B.program) S.program = Object.assign({}, B.program, {seed31:true});
    if(B.cycle && B.cycle.periods) S.cycle = Object.assign(cyDefault(), B.cycle);
    saveProgram();
    lsSave(); renderSheet(); render(); toast((B.sessions || []).length + ' treinos importados');
  }
  else if(act === 'closesheet'){ document.getElementById('sheet').classList.remove('on'); render(); }
  else if(act === 'theme'){ S.program.theme = b.dataset.v; saveProgram(); applyTheme(); renderSheet(); }
  else if(act === 'wunit'){ (S.program.units = S.program.units || {})[b.dataset.ex] = b.dataset.v; saveProgram(); render(); }
  else if(act === 'weeks'){ S.program.weeks = +b.dataset.w; saveProgram(); renderSheet(); render(); }
  else if(act === 'newcycle'){ S.program.start = ymd(); S.program.prior = 0; saveProgram(); renderSheet(); render(); toast('Novo ciclo iniciado'); }
  else if(act === 't-15'){ TM.end -= 15000; if(TM.end < Date.now()) TM.end = Date.now(); tick(); scheduleRest(); }
  else if(act === 't+15'){ if(!TM.int){ TM.end = Date.now(); TM.int = setInterval(tick, 250); } TM.end += 15000; TM.total = Math.max(TM.total, Math.ceil((TM.end-Date.now())/1000)); tick(); scheduleRest(); }
  else if(act === 'tskip'){ stopTimer(); }
});
document.getElementById('sheet').addEventListener('click', e => { if(e.target.id === 'sheet'){ e.currentTarget.classList.remove('on'); render(); } });
