  const t = e.target, k = t.dataset.k; if(!k) return;
  if(k === 'w'){ const d = draft(S.day); d.wt[t.dataset.ex] = t.value.replace(/[^\d.,]/g, ''); (d.wtu = d.wtu || {})[t.dataset.ex] = U(t.dataset.ex); saveDrafts(); }
  else if(k === 'r'){ const ex = PLAN[S.day].ex.find(x => x.id === t.dataset.ex), d = draft(S.day); exSets(d, ex)[+t.dataset.i][k] = t.value.replace(/[^\d.,]/g, ''); saveDrafts(); }
  else if(k === 'pain'){ const d = draft(S.day); d.pain = +t.value; saveDrafts(); const pv = t.closest('.card').querySelector('.pain-val'); pv.style.setProperty('--pc', painColor(d.pain)); pv.innerHTML = `<b>${d.pain}</b><span>de 10</span>`; }
  else if(k === 'painDraft'){ S.painDraft = +t.value; const pv = t.closest('.card').querySelector('.pain-val'); pv.style.setProperty('--pc', painColor(S.painDraft)); pv.querySelector('b').textContent = S.painDraft; }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.k;
  if(k === 'progEx'){ S.progEx = t.value; render(); }
  if(k === 'start' && t.value){ S.program.start = t.value; saveProgram(); render(); }
  if(k === 'prior'){ S.program.prior = Math.max(0, parseInt(t.value, 10) || 0); saveProgram(); render(); }

  if(k === 'cyLen' || k === 'cyPlen'){ const v = parseInt(t.value, 10); if(v){ if(k === 'cyLen') S.cycle.len = Math.min(45, Math.max(20, v)); else S.cycle.plen = Math.min(10, Math.max(2, v)); lsSave(); render(); toast('Duração salva'); } }
  if((k === 'ram' || k === 'rpm') && t.value){ S.program.remind = Object.assign(remind(), { [k === 'ram' ? 'am' : 'pm']: t.value }); saveProgram(); if(S.pushOn) syncPush().then(() => toast('Horário salvo'), () => toast('Salvo no app; o servidor não respondeu')); else toast('Horário salvo'); }
});

/* ---------- Spotify (Web API com login PKCE, sem servidor; controla o Spotify que está tocando no celular) ---------- */
const SPOTIFY_ID = '97a18fb0dd514659bee6f6bfecaad08b';
const SP_REDIRECT = location.origin + location.pathname;
const SP_SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
const SP = { tok:null, now:null, poll:null };
const spEnabled = () => !SPOTIFY_ID.startsWith('__');
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const SPI = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.5v13l9-6.5zM16 5h2.5v14H16z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 5.5v13l-9-6.5zM5.5 5H8v14H5.5z"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="var(--acc)" width="22" height="22"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5l11-2v11.5a2.5 2.5 0 1 1-2-2.45V7.1l-7 1.3z"/></svg>'
};
function spLoad(){ try{ SP.tok = JSON.parse(localStorage.getItem('treino-sp') || 'null'); }catch(e){ SP.tok = null; } }
function spSave(){ try{ SP.tok ? localStorage.setItem('treino-sp', JSON.stringify(SP.tok)) : localStorage.removeItem('treino-sp'); }catch(e){} }
async function spConnect(){
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  const st = b64url(crypto.getRandomValues(new Uint8Array(12)));
  localStorage.setItem('treino-sp-pkce', JSON.stringify({ v, st }));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ client_id:SPOTIFY_ID, response_type:'code', redirect_uri:SP_REDIRECT, code_challenge_method:'S256', code_challenge:ch, scope:SP_SCOPES, state:st });
}
async function spToken(params){
  const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:new URLSearchParams({ client_id:SPOTIFY_ID, ...params }) });
  if(!r.ok) throw new Error('token ' + r.status);
  const j = await r.json();
  SP.tok = { access:j.access_token, refresh:j.refresh_token || (SP.tok && SP.tok.refresh), exp:Date.now() + (j.expires_in - 60) * 1000 };
  spSave();
}
// volta do login do Spotify: troca o código pelo token e limpa a URL
async function spHandleRedirect(){
  const q = new URLSearchParams(location.search);
  if(!q.has('code') && !q.has('error')) return false;
  let pk = null; try{ pk = JSON.parse(localStorage.getItem('treino-sp-pkce') || 'null'); }catch(e){}
  localStorage.removeItem('treino-sp-pkce');
  history.replaceState(null, '', SP_REDIRECT);
  if(q.has('error') || !pk || q.get('state') !== pk.st){ toast('Spotify não conectado'); return true; }
  try{ await spToken({ grant_type:'authorization_code', code:q.get('code'), redirect_uri:SP_REDIRECT, code_verifier:pk.v }); toast('Spotify conectado 🎵'); render(); spStart(); }
  catch(e){ toast('Não deu pra conectar o Spotify'); }
  return true;
}
async function spFetch(path, opt = {}, retry = true){
  if(!SP.tok) return null;
  if(Date.now() > SP.tok.exp){
    try{ await spToken({ grant_type:'refresh_token', refresh_token:SP.tok.refresh }); }
    catch(e){ SP.tok = null; spSave(); render(); toast('Conecte o Spotify de novo nos Ajustes'); return null; }
  }
  const r = await fetch('https://api.spotify.com/v1' + path, { ...opt, headers:{ Authorization:'Bearer ' + SP.tok.access, ...(opt.body ? { 'Content-Type':'application/json' } : {}) } });
  if(r.status === 401 && retry){ SP.tok.exp = 0; return spFetch(path, opt, false); }
  return r;
}
async function spPoll(){
  if(!SP.tok || document.hidden) return;
  try{
    const r = await spFetch('/me/player');
    if(!r) return;
    if(r.status === 204){ SP.now = { idle:true }; }
    else if(r.ok){
      const j = await r.json(), it = j.item || {};
      const imgs = (it.album && it.album.images) || it.images || [];
      SP.now = { playing:j.is_playing, title:it.name || '—', artist:(it.artists || []).map(a => a.name).join(', ') || (it.show && it.show.name) || '', img:(imgs[imgs.length - 1] || imgs[0] || {}).url || '', device:j.device && j.device.name };
    }
  }catch(e){}
  spPaint();
}
function spStart(){ clearInterval(SP.poll); if(!SP.tok) return; spPoll(); SP.poll = setInterval(spPoll, 5000); }
function spInner(){
  const n = SP.now;
  if(!n) return `<div class="cv">${SPI.note}</div><div class="tx"><i>SPOTIFY</i><b>Carregando…</b></div>`;
  if(n.idle) return `<div class="cv">${SPI.note}</div><div class="tx"><i>SPOTIFY</i><b>Nada tocando</b><span>Toque ▶ para continuar de onde parou</span></div>
    <div class="ctl"><button class="pp" data-act="sp-play" aria-label="Tocar">${SPI.play}</button></div>`;
  return `<div class="cv" style="${n.img ? `background-image:url('${esc(n.img)}')` : ''}">${n.img ? '' : SPI.note}</div>
    <div class="tx"><i>SPOTIFY${n.device ? ' · ' + esc(n.device) : ''}</i><b>${esc(n.title)}</b><span>${esc(n.artist)}</span></div>
    <div class="ctl"><button data-act="sp-prev" aria-label="Música anterior">${SPI.prev}</button><button class="pp" data-act="${n.playing ? 'sp-pause' : 'sp-play'}" aria-label="${n.playing ? 'Pausar' : 'Tocar'}">${n.playing ? SPI.pause : SPI.play}</button><button data-act="sp-next" aria-label="Próxima música">${SPI.next}</button></div>`;
}
function spCard(){ return spEnabled() && SP.tok ? `<section class="sp glass" id="spcard" aria-label="Spotify">${spInner()}</section>` : ''; }
function spPaint(){ const el = document.getElementById('spcard'); if(el) el.innerHTML = spInner(); }
// sem aparelho ativo: acorda o Spotify do celular (ou o primeiro disponível)
async function spWake(){
  const r = await spFetch('/me/player/devices'); if(!r || !r.ok) return false;
  const ds = (await r.json()).devices || [];
  const d = ds.find(x => x.type === 'Smartphone') || ds[0];
  if(!d){ toast('Abra o Spotify no celular e toque uma música uma vez'); return false; }
  await spFetch('/me/player', { method:'PUT', body:JSON.stringify({ device_ids:[d.id], play:true }) });
  return true;
}
async function spCmd(act){
  const map = { 'sp-play':['PUT','/me/player/play'], 'sp-pause':['PUT','/me/player/pause'], 'sp-next':['POST','/me/player/next'], 'sp-prev':['POST','/me/player/previous'] };
  const [method, path] = map[act];
  if(SP.now && !SP.now.idle && (act === 'sp-play' || act === 'sp-pause')){ SP.now.playing = act === 'sp-play'; spPaint(); }
  try{
    const r = await spFetch(path, { method });
    if(r && r.status === 404){ await spWake(); }
    else if(r && r.status === 403){ toast('O Spotify recusou: precisa do Premium'); }
  }catch(e){ toast('Spotify não respondeu'); }
  setTimeout(spPoll, 500);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && SP.tok) spPoll(); });

/* ---------- comentários nos exercícios ----------
   Ela avalia o treino (estrelas + comentários/dúvidas) → o servidor (Cloudflare) responde na hora com a IA grátis → à noite o Claude revisa e responde,
   podendo propor mudança no treino, que ela aprova aqui. Nada vai para o Thiago. */
function myUid(){
  let u = localStorage.getItem('treino-uid');
  if(!u || !/^[a-z0-9]{12,40}$/.test(u)){ u = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 32); localStorage.setItem('treino-uid', u); }
  return u;
}
function cmLoad(){ try{ S.notes = JSON.parse(localStorage.getItem('treino-notes') || '[]'); }catch(e){ S.notes = []; } try{ S.cmSeen = new Set(JSON.parse(localStorage.getItem('treino-notes-seen') || '[]')); }catch(e){ S.cmSeen = new Set(); } }
function cmSave(){ try{ localStorage.setItem('treino-notes', JSON.stringify(S.notes.slice(-200))); localStorage.setItem('treino-notes-seen', JSON.stringify([...S.cmSeen].slice(-400))); }catch(e){} }
const cmTyping = () => document.activeElement && document.activeElement.tagName === 'TEXTAREA';
async function cmFetch(){
  if(!navigator.onLine) return;
  try{
    const r = await api('/notes', { uid:myUid() });
    const before = JSON.stringify(S.notes);
    S.notes = r.notes || []; cmSave();
    if(JSON.stringify(S.notes) !== before && !cmTyping()) render();
  }catch(e){}
}
function cmItem(n){
  const tags = (n.tags || []).join(' · ');
  let h = `<div class="cm-item ${n.claude && !S.cmSeen.has(n.id) ? 'cm-new' : ''}"><div class="me"><b>Você · ${fmtDate(n.date)}</b>${n.rating ? ` <span class="st" aria-label="${n.rating} de 5 estrelas">${'★'.repeat(n.rating)}<span>${'★'.repeat(5 - n.rating)}</span></span>` : ''}${tags ? ` <span class="tg">· ${esc(tags)}</span>` : ''}${n.text ? '<br>' + esc(n.text) : ''}</div>`;
  if(n.ai) h += `<div class="rp"><b>Resposta rápida:</b> ${esc(n.ai.text)}</div>`;
  h += n.claude ? `<div class="rp"><b>Claude:</b> ${esc(n.claude.text)}</div>` : `<div class="rp"><i>🌙 O Claude revisa com calma à noite.</i></div>`;
  const c = n.change;
  if(c){
    if(c.status === 'proposta') h += `<div class="cm-chg"><b>Sugestão de mudança no treino:</b> ${esc(c.summary)}${c.detail ? '<br><span class="tg">' + esc(c.detail) + '</span>' : ''}<div class="row"><button class="btn sm" data-act="cm-yes" data-id="${n.id}">Aplicar essa mudança</button><button class="btn sm ghost" data-act="cm-no" data-id="${n.id}">Agora não</button></div></div>`;
    else if(c.status === 'aprovada') h += `<div class="cm-chg">✅ Você aprovou: <b>${esc(c.summary)}</b>. O Claude aplica no seu treino na próxima revisão.</div>`;
    else if(c.status === 'aplicada') h += `<div class="cm-chg">✅ Aplicado no seu treino: <b>${esc(c.summary)}</b>${c.note ? '<br><span class="tg">' + esc(c.note) + '</span>' : ''}</div>`;
    else if(c.status === 'recusada') h += `<div class="rp"><i>Você preferiu manter como está.</i></div>`;
  }
  return h + `</div>`;
}
function rvCard(dayKey = S.day, date = ymd(), embed = false){
  const plan = PLAN[dayKey], key = 'treino-' + dayKey;
  const mine = (S.notes || []).filter(n => n.ex === key && (!embed || n.date === date)).slice(-2).reverse();
  const sent = mine.some(n => n.date === date), st = S.rvStars || 0;
  let h = embed ? `<div class="rv rv-in"><b class="rv-t">⭐ Avaliar este treino</b>` : `<section class="card glass rv"><h3>⭐ Avaliar treino</h3>`;
  if(!sent || S.rvAgain === date){
    h += `<p class="hint">Como foi o ${esc(plan.tag || 'treino')} ${date === ymd() ? 'de hoje' : 'de ' + fmtDate(date)}? Dê uma nota e deixe seus comentários ou dúvidas.</p>
    <div class="stars" role="radiogroup" aria-label="Nota do treino">${[1,2,3,4,5].map(v => `<button data-act="rv-star" data-v="${v}" class="${v <= st ? 'on' : ''}" role="radio" aria-checked="${v === st}" aria-label="${v} ${v === 1 ? 'estrela' : 'estrelas'}">★</button>`).join('')}<span class="lbl" id="rv-lbl">${['Toque para dar a nota','Ruim','Fraco','Ok','Bom','Ótimo'][st]}</span></div>
    <div class="rv-wrap"><textarea id="rv-text" class="rv-ta" maxlength="1000" placeholder="O que achou do treino? Alguma dúvida? Escreva ou toque no 🎤 e fale." aria-label="Comentários e dúvidas sobre o treino"></textarea>
    ${SR ? `<button class="mic" data-act="rv-mic" aria-label="Falar em vez de escrever" aria-pressed="false">${ICON.mic}</button>` : ''}</div>
    <p class="mic-st" id="rv-mic-st">${SR ? 'Toque no 🎤 para falar. Toque de novo para parar.' : 'Dica: use o microfone do teclado para ditar.'}</p>
    <button class="btn" data-act="rv-send" data-day="${dayKey}" data-date="${date}">Enviar avaliação</button>`;
  } else h += `<p class="hint" style="margin-bottom:10px">Avaliação ${date === ymd() ? 'de hoje ' : ''}enviada. <button class="tbtn" data-act="rv-again" data-date="${date}">Avaliar de novo</button></p>`;
  if(mine.length) h += `<div style="margin-top:12px">${mine.map(cmItem).join('')}</div>`;
  return h + (embed ? '</div>' : '</section>');
}
// ditado por voz (reconhecimento de fala do Chrome, em português, grátis): o texto entra no campo e ela confere antes de enviar
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function micStop(){ try{ rec && rec.stop(); }catch(e){} }
function micToggle(btn){
  if(rec){ micStop(); return; }
  const ta = document.getElementById('rv-text'), st = document.getElementById('rv-mic-st');
  if(!ta || !SR) return;
  const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  let finalTxt = '';
  rec = new SR(); rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => { let interim = ''; for(let i = e.resultIndex; i < e.results.length; i++){ const r = e.results[i]; if(r.isFinal) finalTxt += r[0].transcript + ' '; else interim += r[0].transcript; } ta.value = (base + finalTxt + interim).slice(0, 1000); };
  rec.onstart = () => { btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true'); if(st) st.textContent = '🔴 Ouvindo… fale à vontade. Toque no 🎤 para parar.'; };
  rec.onerror = e => { if(st) st.textContent = e.error === 'not-allowed' ? 'Permita o microfone para o app nas configurações.' : e.error === 'no-speech' ? 'Não ouvi nada. Toque no 🎤 e tente de novo.' : 'O ditado parou. Toque no 🎤 para continuar.'; };
  rec.onend = () => { rec = null; btn.classList.remove('on'); btn.setAttribute('aria-pressed', 'false'); if(st && st.textContent.startsWith('🔴')) st.textContent = 'Pronto. Confira o texto e envie, ou toque no 🎤 para falar mais.'; ta.value = ta.value.replace(/\s+$/, ''); };
  try{ rec.start(); }catch(e){ rec = null; }
}
async function rvSend(dayKey = S.day, date = ymd()){
  micStop();
  const ta = document.getElementById('rv-text'), text = (ta && ta.value || '').trim(), rating = S.rvStars || null;
  if(!text && !rating){ toast('Dê uma nota ou escreva um comentário'); return; }
  const plan = PLAN[dayKey], d = date === ymd() ? draft(dayKey) : { log:{}, wt:{} }, today = date;
  const t = S.cycle && S.cycle.periods.length ? cyInfo(today) : null;
  const lastPain = [...S.pain].sort((a, b) => b.ts - a.ts)[0];
  const sess = S.sessions.filter(x => x.date === date && x.day === dayKey).sort((a, b) => b.finishedAt - a.finishedAt)[0];
  const feito = plan.ex.map(ex => { const sets = (sess && sess.log && sess.log[ex.id]) || (date === ymd() ? ((d.log || {})[ex.id] || []).filter(x => x.done) : []); if(!sets.length) return null; const w = Math.max(0, ...sets.map(x => +x.w || 0)) || (date === ymd() && d.wt ? parseFloat(String(d.wt[ex.id] || '').replace(',', '.')) || 0 : 0); return `${ex.name} ${sets.length}/${ex.sets}${w ? ' (' + fmtNum(w) + ' kg)' : ''}`; }).filter(Boolean).join('; ');
  const btn = document.querySelector('[data-act="rv-send"]'); if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }
  try{
    const r = await api('/note', { uid:myUid(), app:'kika', date, ex:'treino-' + dayKey, exName:`${plan.tag || ''} · ${plan.title}`.trim(), text, rating,
      ctx:{ series: plan.ex.map(e => `${e.name} ${e.sets}×${e.reps}`).join('; '), load: feito || 'nenhuma série marcada', phase: t ? CY_PH[t.ph].label : '', pain: lastPain ? lastPain.value : null, obs: plan.note } });
    S.notes.push(r.note); cmSave(); S.rvStars = 0; S.rvAgain = null; render(); toast('Avaliação enviada');
    setTimeout(() => { const el = document.querySelector('.rv'); if(el) el.scrollIntoView({ behavior:'smooth', block:'center' }); }, 100);
  }catch(e){ toast(navigator.onLine ? 'Não deu pra enviar. Tente de novo.' : 'Sem internet. Tente de novo depois.'); if(btn){ btn.disabled = false; btn.textContent = 'Enviar avaliação'; } }
}
function cmCard(){
  const nw = (S.notes || []).filter(n => n.claude && !S.cmSeen.has(n.id));
  if(!nw.length) return '';
  return `<section class="card glass cm-new"><h3>💬 O Claude respondeu ${nw.length === 1 ? 'seu comentário' : nw.length + ' comentários'}</h3>
    ${nw.slice(-3).map(n => `<p class="hint" style="margin:10px 0 4px"><b style="color:var(--text)">${esc(n.exName)}</b></p>` + cmItem(n)).join('')}
    <button class="btn sm ghost" data-act="cm-seen">Ok, li</button></section>`;
}
async function cmDecide(id, no){
  try{ const r = await api('/approve', { uid:myUid(), id, no:!!no }); const n = S.notes.find(x => x.id === id); if(n) n.change = r.change; cmSave(); render(); toast(no ? 'Ok, fica como está' : 'Aprovado! O Claude aplica à noite.'); }
  catch(e){ toast('Não deu pra enviar. Tente de novo.'); }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) cmFetch(); });

/* ---------- tela de abertura: só quando o app abre do zero (não ao voltar de outro app) ---------- */
function showIntro(){
  const el = document.getElementById('intro');
  if(location.hash){ el.classList.add('off'); return; } // aberto por notificação: vai direto
  const ci = cycleInfo(), plan = PLAN[todayKey()];
  document.getElementById('introWk').textContent = (ci.notStarted ? 'Ciclo começa em breve' : `Semana ${ci.week} de ${ci.weeks}`) + ' · hoje: ' + (plan.type === 'rest' ? 'descanso' : (plan.tag || TYPES[plan.type].label));
  const hide = () => el.classList.add('off');
  el.addEventListener('click', hide, { once:true });
  setTimeout(hide, 10000); // fica até o toque, ou some sozinha em 10 s
}

/* ---------- início ---------- */
(function boot(){
  const L = lsLoad();
  S.program = L.program || defaultProgram();
  seed31();
  S.pushOn = !!localStorage.getItem('treino-push-on');
  S.drafts = L.drafts || {}; S.sessions = L.sessions || []; S.pain = L.pain || [];
  S.cycle = Object.assign(cyDefault(), L.cycle || {});
  cmLoad();
  Object.keys(S.drafts).forEach(k => { if(!S.drafts[k] || S.drafts[k].date !== ymd()) delete S.drafts[k]; });
  const h = location.hash.slice(1); if(['treino','progresso','joelho','guia'].includes(h)) S.tab = h; if(h === 'ciclo'){ S.tab = 'progresso'; S.prog = 'ciclo'; }
  spLoad();
  const spBack = location.search.includes('code=') || location.search.includes('error=');
  render();
  if(spBack) document.getElementById('intro').classList.add('off'); else showIntro();
  spHandleRedirect().then(back => { if(!back) spStart(); });
  cmFetch();
  if(S.pushOn) syncPush().catch(() => {}); // garante que o celular dela está ligado ao aparelho dos comentários
  persistStorage();
  
})();
